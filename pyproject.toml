[project]
name = "huntx"
version = "0.2.0"
description = "HuntX — proxy config hunter and aggregator pipeline"
requires-python = ">=3.11"
#
# NOTE: Telethon depends on `rsa`/`pyaes`. Pin to modern versions to avoid
# legacy sdists that fetch insecure HTTP build deps during resolution.
dependencies = [
  "PyYAML>=6.0",
  "telethon>=1.42,<2",
  "pydantic>=2.0",
  "pyaes>=1.6.1",
  "rsa>=4.9.1",
  "pyasn1>=0.6.4",
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "black",
  "flake8",
  "mypy",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
huntx = "huntx.cli.hardened_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"huntx.state" = ["schema.sql"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huntx.bot.delivery"
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "huntx.bot.interactive"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "perf: marks performance regression benchmarks (exclude with '-m not perf')",
  "asyncio: run the test in an asyncio event loop",
]

# NOTE: there is deliberately no [tool.flake8] section here. flake8 does not
# read pyproject.toml (it only supports setup.cfg / tox.ini / .flake8), so such
# a section is silently inert. The single source of truth is .flake8.
