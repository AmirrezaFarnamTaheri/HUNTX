[project]
name = "huntx"
version = "0.2.0"
description = "HuntX — proxy config hunter and aggregator pipeline"
requires-python = ">=3.11"
#
# NOTE: Telethon depends on `rsa`/`pyaes`. Pin to modern versions to avoid
# legacy sdists that fetch insecure HTTP build deps during resolution.
dependencies = [
  "PyYAML>=6.0",
  "telethon>=1.42,<2",
  "pydantic>=2.0",
  "pyaes>=1.6.1",
  "rsa>=4.9.1",
  "pyasn1>=0.6.0",
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "mypy", "types-PyYAML"]

[project.scripts]
huntx = "huntx.cli.hardened_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huntx.bot.delivery"
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "huntx.bot.interactive"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# NOTE: there is deliberately no [tool.flake8] section here. flake8 does not
# read pyproject.toml (it only supports setup.cfg / tox.ini / .flake8), so such
# a section is silently inert — verified against flake8 7.3.0, which ignored a
# max-line-length set only in pyproject and fell back to the 79-char default.
# Keeping a duplicate here invited edits that appear to work but change nothing.
# The single source of truth for flake8 is the .flake8 file.