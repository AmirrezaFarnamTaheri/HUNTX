name: HUNTX Recovery Fanout Repair V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/huntx-recovery-fanout-repair-v2.yml"

permissions:
  actions: write
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    name: repair-and-validate-recovery-fanout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply permanent recovery fanout fix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_BLOCK_B64: "ICAgICAgcmVjb3ZlcnlfZmFub3V0OgogICAgICAgIGRlc2NyaXB0aW9uOiAiSW50ZXJuYWw6IGV4cGxpY2l0bHkgZGlzcGF0Y2ggZG93bnN0cmVhbSB3b3JrZmxvd3MgZm9yIHRva2VuLXN0YXJ0ZWQgcmVjb3ZlcnkgcnVucyIKICAgICAgICByZXF1aXJlZDogZmFsc2UKICAgICAgICB0eXBlOiBib29sZWFuCiAgICAgICAgZGVmYXVsdDogZmFsc2UK"
          FANOUT_B64: ""
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          production_path = Path('.github/workflows/huntx.yml')
          text = production_path.read_text(encoding='utf-8')
          input_block = base64.b64decode(os.environ['INPUT_BLOCK_B64']).decode('utf-8')
          fanout = base64.b64decode(os.environ['FANOUT_B64']).decode('utf-8')

          if '      recovery_fanout:\n' not in text:
              anchor = '      reset_confirm:\n        description: "Type RESET-HUNTX-STATE exactly"\n        required: false\n        default: ""\n'
              if anchor not in text:
                  raise SystemExit('huntx.yml: reset_confirm input block not found')
              text = text.replace(anchor, anchor + input_block, 1)

          if '  recovery-downstream-fanout:\n' not in text:
              text = text.rstrip() + '\n' + fanout.lstrip('\n')

          production_path.write_text(text, encoding='utf-8')

          watchdog_path = Path('.github/workflows/huntx-schedule-watchdog.yml')
          watchdog = watchdog_path.read_text(encoding='utf-8')
          needle = '"repos/${GH_REPO}/actions/workflows/huntx.yml/dispatches" \\\n                        -f ref=main'
          replacement = needle + ' \\\n                        -f "inputs[recovery_fanout]=true"'
          if 'inputs[recovery_fanout]' not in watchdog:
              if needle not in watchdog:
                  raise SystemExit('watchdog: production dispatch block not found')
              watchdog = watchdog.replace(needle, replacement, 1)
          watchdog_path.write_text(watchdog, encoding='utf-8')
          PY

          rm -f .github/workflows/huntx-recovery-fanout-repair-v2.yml
          git add .github/workflows/huntx.yml .github/workflows/huntx-schedule-watchdog.yml .github/workflows/huntx-recovery-fanout-repair-v2.yml
          git diff --cached --check
          git diff --cached -- .github/workflows/huntx.yml .github/workflows/huntx-schedule-watchdog.yml
          git commit -m "Complete HUNTX recovery downstream fanout"
          git push origin HEAD:main

          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/huntx.yml/dispatches" \
            -f ref=main \
            -f "inputs[recovery_fanout]=true"
          echo "Started one production recovery-path validation run."
