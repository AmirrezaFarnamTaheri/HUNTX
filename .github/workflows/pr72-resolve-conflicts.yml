name: PR72 resolve conflicts

on:
  push:
    branches:
      - feat/next-gen-architecture-and-hardening

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Merge main, resolve shared conflicts, validate, and push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/feat/next-gen-architecture-and-hardening:refs/remotes/origin/pr"
          git checkout -B feat/next-gen-architecture-and-hardening refs/remotes/origin/pr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            echo "Resolving all conflicted shared paths in favor of current main"
            while IFS= read -r -d '' path; do
              echo "resolve: $path"
              git checkout --theirs -- "$path"
              git add -- "$path"
            done < <(git diff --name-only --diff-filter=U -z)
          fi

          echo "Formatting PR-added Go engine files"
          if [ -d cmd/huntx-engine ]; then
            find cmd/huntx-engine -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
          fi

          echo "Applying compatible PR integration fixes"
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/perf/test_transform_bench.py": [("import time\n", "")],
              "tests/test_bot_alerts.py": [
                  ("from unittest.mock import AsyncMock, MagicMock\n", "from unittest.mock import AsyncMock\n")
              ],
              "tests/test_proxy_scoring.py": [("import pytest\n", "")],
              "tests/test_resilience_engine.py": [("import asyncio\n", "")],
              "tests/test_unified_orchestrator.py": [
                  ("from unittest.mock import MagicMock, patch\n", "from unittest.mock import patch\n"),
                  ("    TelegramUserSourceConfig,\n", ""),
              ],
          }
          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  text = text.replace(old, new)
              path.write_text(text)

          path = Path("tests/test_formats_coverage.py")
          path.write_text(path.read_text().rstrip() + "\n")

          # Preserve the PR's explicit perf-marker contract without turning
          # machine-sensitive microbenchmarks into main/production merge gates.
          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          perf_marker = '  "perf: marks performance regression benchmarks (exclude with \'-m not perf\')",\n'
          if perf_marker not in text:
              text = text.replace("markers = [\n", "markers = [\n" + perf_marker, 1)
          pyproject.write_text(text)

          for filename in [
              ".github/workflows/pr-validation.yml",
              ".github/workflows/huntx.yml",
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace(
                  "python -m pytest -q --strict-config --strict-markers",
                  'python -m pytest -q -m "not perf" --strict-config --strict-markers',
              )
              path.write_text(text)

          # Main's delivery implementation is authoritative, but PR #72 adds a
          # compatible freshness-alert API and tests. Re-add only that helper.
          delivery = Path("src/huntx/bot/delivery.py")
          text = delivery.read_text()
          if "async def send_freshness_alert(" not in text:
              method = '''    async def send_freshness_alert(
              self,
              admin_chat_id: int,
              proxy_count: int,
              min_threshold: int = 10,
              status_msg: str = "Pipeline Complete",
          ) -> bool:
              """Send a pipeline freshness report to the configured admin chat."""
              try:
                  alert_prefix = (
                      "⚠️ [LOW FRESHNESS WARNING]"
                      if proxy_count < min_threshold
                      else "✅ [PIPELINE REPORT]"
                  )
                  message = (
                      f"{alert_prefix} {status_msg}\\n"
                      f"Fresh Proxies Available: {proxy_count} (Min Threshold: {min_threshold})"
                  )
                  client = getattr(self, "client", None)
                  if client:
                      await self._send_with_floodwait(client.send_message, admin_chat_id, message)
                      return True
              except Exception as exc:
                  logger.error("[GatherX] Failed to send freshness alert: %s", exc)
              return False

          '''
              text = text.replace("class DeliveryMixin:\n", "class DeliveryMixin:\n" + method, 1)
              delivery.write_text(text)
          PY

          rm -f .github/workflows/pr72-resolve-conflicts.yml
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          test -z "$unresolved" || {
            printf 'Unresolved conflicts remain:\n%s\n' "$unresolved"
            exit 1
          }
          git diff --check --cached

          echo "Validating workflow YAML"
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.{yml,yaml}"].sort
            abort "No workflow files found" if paths.empty?
            paths.each { |path| YAML.load_file(path) }
          '

          echo "Go quality gate"
          formatting="$(gofmt -l .)"
          test -z "$formatting" || {
            printf 'Unformatted Go files:\n%s\n' "$formatting"
            exit 1
          }
          go test -race ./...
          go vet ./...
          go build ./cmd/huntx-tools
          if [ -f cmd/huntx-engine/go.mod ]; then
            (cd cmd/huntx-engine && go test ./... && go vet ./...)
          fi

          echo "Python quality gate"
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary \
            flake8==7.3.0 \
            mypy==2.3.0 \
            pytest==9.1.1 \
            pytest-asyncio==1.4.0 \
            types-requests==2.33.0.20260712 \
            types-PyYAML==6.0.12.20260724
          python -m pip install --no-deps -e .
          python -m pip check
          python -m compileall -q -j 0 src tests scripts
          python -m flake8 src/huntx tests scripts --count --statistics
          python -m mypy src/huntx
          python -m pytest -q -m "not perf" --strict-config --strict-markers --durations=20

          git status --short
          git commit -m "merge: resolve PR #72 conflicts with current main"
          git push origin HEAD:refs/heads/feat/next-gen-architecture-and-hardening
