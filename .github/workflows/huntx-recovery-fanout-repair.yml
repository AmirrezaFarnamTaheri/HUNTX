name: HUNTX Recovery Fanout Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/huntx-recovery-fanout-repair.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    name: repair-and-validate-recovery-fanout
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Bootstrap HUNTX recovery fanout repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch recovery fanout contract
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path

          production_path = Path('.github/workflows/huntx.yml')
          text = production_path.read_text(encoding='utf-8')

          input_block = '''      recovery_fanout:
            description: "Internal: explicitly dispatch downstream workflows for token-started recovery runs"
            required: false
            type: boolean
            default: false
          '''
          input_block = input_block.replace('          \n', '')
          if '      recovery_fanout:\n' not in text:
              anchor = '''      reset_confirm:
                description: "Type RESET-HUNTX-STATE exactly"
                required: false
                default: ""
          '''.replace('          \n', '')
              if anchor not in text:
                  raise SystemExit('huntx.yml: reset_confirm input block not found')
              text = text.replace(anchor, anchor + input_block, 1)

          fanout_marker = '  recovery-downstream-fanout:\n'
          if fanout_marker not in text:
              fanout = r'''

          recovery-downstream-fanout:
            name: recovery-downstream-fanout
            needs: [validate, restore, run, persist, deploy-pages]
            if: >-
              ${{
                always() &&
                github.event_name == 'workflow_dispatch' &&
                inputs.recovery_fanout == true &&
                !contains(needs.*.result, 'failure') &&
                !contains(needs.*.result, 'cancelled')
              }}
            runs-on: ubuntu-24.04
            timeout-minutes: 10
            permissions:
              actions: write
              contents: read
            steps:
              - name: Dispatch downstream recovery consumers
                env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ github.run_id }}
                  SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
                run: |
                  set -euo pipefail
                  gh api --method POST \
                    "repos/${GH_REPO}/actions/workflows/publish-generated-outputs.yml/dispatches" \
                    -f ref=main \
                    -f "inputs[source_run_id]=${SOURCE_RUN_ID}" \
                    -f "inputs[source_run_attempt]=${SOURCE_RUN_ATTEMPT}"
                  gh api --method POST \
                    "repos/${GH_REPO}/actions/workflows/huntx-real-investigation-gate.yml/dispatches" \
                    -f ref=main \
                    -f "inputs[run_id]=${SOURCE_RUN_ID}"
                  gh api --method POST \
                    "repos/${GH_REPO}/actions/workflows/huntx-telegram-activity-gate.yml/dispatches" \
                    -f ref=main \
                    -f "inputs[run_id]=${SOURCE_RUN_ID}"
                  echo "Explicit recovery fanout dispatched for production run ${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}."
          '''
              import textwrap
              text = text.rstrip() + '\n' + textwrap.dedent(fanout).lstrip('\n')

          production_path.write_text(text, encoding='utf-8')

          watchdog_path = Path('.github/workflows/huntx-schedule-watchdog.yml')
          watchdog = watchdog_path.read_text(encoding='utf-8')
          old = '''                      gh api --method POST \\
                        "repos/${GH_REPO}/actions/workflows/huntx.yml/dispatches" \\
                        -f ref=main
          '''.replace('          \n', '')
          new = '''                      gh api --method POST \\
                        "repos/${GH_REPO}/actions/workflows/huntx.yml/dispatches" \\
                        -f ref=main \\
                        -f "inputs[recovery_fanout]=true"
          '''.replace('          \n', '')
          if 'inputs[recovery_fanout]' not in watchdog:
              if old not in watchdog:
                  raise SystemExit('watchdog: production dispatch block not found')
              watchdog = watchdog.replace(old, new, 1)
          watchdog_path.write_text(watchdog, encoding='utf-8')
          PY

          rm -f .github/workflows/huntx-recovery-fanout-repair.yml
          git add .github/workflows/huntx.yml .github/workflows/huntx-schedule-watchdog.yml .github/workflows/huntx-recovery-fanout-repair.yml
          git diff --cached --check
          git diff --cached -- .github/workflows/huntx.yml .github/workflows/huntx-schedule-watchdog.yml
          git commit -m "Complete HUNTX recovery downstream fanout"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if (( attempt == 3 )); then
              echo "Unable to push recovery fanout repair after retries." >&2
              exit 1
            fi
            git pull --rebase origin main
          done

          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/huntx.yml/dispatches" \
            -f ref=main \
            -f "inputs[recovery_fanout]=true"
          echo "Started one production recovery-path validation run."
