name: HUNTX Post-Publish Validation Repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/huntx-postpublish-validation-repair.yml"

permissions:
  actions: write
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    name: repair-post-publish-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Patch publisher and remove repair scaffold
        env:
          REPAIR_FILE: .github/workflows/huntx-postpublish-validation-repair.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-generated-outputs.yml')
          text = path.read_text(encoding='utf-8')

          old_permissions = '''permissions:
            actions: read
            contents: write
          '''
          new_permissions = '''permissions:
            actions: write
            contents: write
          '''
          if text.count(old_permissions) != 1:
              raise SystemExit('publisher permissions anchor missing or ambiguous')
          text = text.replace(old_permissions, new_permissions, 1)

          old_timeout = '''    timeout-minutes: 25
          '''
          new_timeout = '''    timeout-minutes: 45
          '''
          if text.count(old_timeout) != 1:
              raise SystemExit('publisher timeout anchor missing or ambiguous')
          text = text.replace(old_timeout, new_timeout, 1)

          anchor = '''      - name: Summarize publication
          '''
          if text.count(anchor) != 1:
              raise SystemExit('publication summary anchor missing or ambiguous')

          validation = r'''      - name: Validate resulting main head
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected_sha" || {
            echo "::error title=Main validation unavailable::Could not resolve refs/heads/main after publication."
            exit 1
          }

          runs_url="repos/${GH_REPO}/actions/workflows/pr-validation.yml/runs?branch=main&per_page=30"
          before_id="$(gh api "$runs_url" | jq -r '[.workflow_runs[] | select(.event == "workflow_dispatch") | .id] | max // 0')"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Dispatching pull-request-validation for published main head $expected_sha."
          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/pr-validation.yml/dispatches" \
            -f ref=main

          validation_id=""
          for _ in $(seq 1 30); do
            runs="$(gh api "$runs_url")"
            validation_id="$(jq -r \
              --argjson before "$before_id" \
              --arg started "$started_at" \
              --arg expected "$expected_sha" \
              '[.workflow_runs[]
                | select(.event == "workflow_dispatch")
                | select(.id > $before)
                | select(.created_at >= $started)
                | select(.head_sha == $expected)]
               | sort_by(.created_at)
               | .[0].id // empty' <<<"$runs")"
            if [[ -n "$validation_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$validation_id" ]]; then
            echo "::error title=Main validation not observable::pr-validation was dispatched for $expected_sha but no matching run appeared."
            exit 1
          fi

          echo "Captured pull-request-validation run $validation_id for $expected_sha."
          for _ in $(seq 1 180); do
            run="$(gh api "repos/${GH_REPO}/actions/runs/${validation_id}")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            echo "validation run $validation_id: status=$status conclusion=${conclusion:-pending}"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "::error title=Published main validation failed::pull-request-validation run $validation_id concluded $conclusion."
                exit 1
              fi
              echo "Published main head $expected_sha passed pull-request-validation."
              exit 0
            fi
            sleep 10
          done

          echo "::error title=Published main validation timed out::pull-request-validation run $validation_id did not complete within the validation window."
          exit 1

'''
          text = text.replace(anchor, validation + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm "$REPAIR_FILE"
          git diff --check
          git diff -- .github/workflows/publish-generated-outputs.yml

      - name: Commit permanent publisher repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-generated-outputs.yml
          git commit -m "Validate main after generated output publication"
          git push origin HEAD:main

      - name: Validate repaired control plane
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          runs_url="repos/${GH_REPO}/actions/workflows/pr-validation.yml/runs?branch=main&per_page=30"
          before_id="$(gh api "$runs_url" | jq -r '[.workflow_runs[] | select(.event == "workflow_dispatch") | .id] | max // 0')"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/pr-validation.yml/dispatches" \
            -f ref=main

          validation_id=""
          for _ in $(seq 1 30); do
            runs="$(gh api "$runs_url")"
            validation_id="$(jq -r \
              --argjson before "$before_id" \
              --arg started "$started_at" \
              --arg expected "$expected_sha" \
              '[.workflow_runs[]
                | select(.event == "workflow_dispatch")
                | select(.id > $before)
                | select(.created_at >= $started)
                | select(.head_sha == $expected)]
               | sort_by(.created_at)
               | .[0].id // empty' <<<"$runs")"
            [[ -n "$validation_id" ]] && break
            sleep 2
          done
          test -n "$validation_id" || {
            echo "::error::Could not capture repaired-control-plane validation run."
            exit 1
          }

          echo "Captured validation run $validation_id."
          for _ in $(seq 1 120); do
            run="$(gh api "repos/${GH_REPO}/actions/runs/${validation_id}")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            echo "validation run $validation_id: status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          echo "::error::Repaired-control-plane validation timed out."
          exit 1
