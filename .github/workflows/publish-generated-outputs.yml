name: Publish Generated Outputs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-generated-outputs.yml"
      - "scripts/assemble_generated_snapshot.py"
  workflow_run:
    workflows:
      - huntx-production
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful huntx-production workflow run ID to republish
        required: true
        type: string
      source_run_attempt:
        description: Current attempt number for the source run
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-generated-outputs
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified generated snapshot
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Resolve and validate source run
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const expectedPath = '.github/workflows/huntx.yml';

            const requiredArtifactNames = run => [
              `runtime-checkpoint-${run.id}-${run.run_attempt}`,
              `huntx-output-${run.id}-${run.run_attempt}`,
              `huntx-logs-${run.id}-${run.run_attempt}`,
            ];

            function noReleaseVerdictName(run) {
              return `huntx-no-release-${run.id}-${run.run_attempt}`;
            }

            // A run that deliberately withheld a release uploads an explicit
            // no-release verdict. That lets the publisher tell an intentional
            // "nothing to publish" (safety net or degraded producer) from a
            // genuinely anomalous missing artifact.
            async function publicationArtifacts(run) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(run.id),
                per_page: 100,
              });
              const available = new Set(
                data.artifacts
                  .filter(artifact => !artifact.expired)
                  .map(artifact => artifact.name),
              );
              const missing = requiredArtifactNames(run).filter(
                name => !available.has(name),
              );
              const intentional = !available.has(`huntx-output-${run.id}-${run.run_attempt}`)
                && available.has(noReleaseVerdictName(run));
              return { ready: missing.length === 0, missing, intentional };
            }

            let runId;
            let expectedAttempt;
            let selectedRun = null;

            if (context.eventName === 'workflow_run') {
              runId = Number(context.payload.workflow_run.id);
              expectedAttempt = Number(context.payload.workflow_run.run_attempt);
              const trigger = await publicationArtifacts({ id: runId, run_attempt: expectedAttempt });
              if (!trigger.ready) {
                if (trigger.intentional) {
                  core.setOutput('ready', 'false');
                  core.notice(
                    `Producer run ${runId} intentionally published no release; the current deployment is preserved.`,
                  );
                  return;
                }
                core.setFailed(
                  `Run ${runId} is missing required publication artifacts: ${trigger.missing.join(', ')}`,
                );
                return;
              }
            } else if (context.eventName === 'workflow_dispatch') {
              runId = Number('${{ inputs.source_run_id }}');
              expectedAttempt = Number('${{ inputs.source_run_attempt }}');
            } else if (context.eventName === 'push') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'huntx.yml',
                branch: 'main',
                status: 'completed',
                per_page: 50,
              });

              for (const candidate of data.workflow_runs) {
                if (
                  candidate.conclusion !== 'success'
                  || candidate.path !== expectedPath
                  || candidate.name !== 'huntx-production'
                ) {
                  continue;
                }
                // A control-plane change cannot safely republish artifacts
                // produced by an older main commit. Await a production run
                // on this revision rather than resurrecting retired formats.
                if (candidate.head_sha !== context.sha) {
                  core.info(`Skipping stale producer ${candidate.id}: ${candidate.head_sha} != ${context.sha}.`);
                  continue;
                }
                const artifacts = await publicationArtifacts(candidate);
                if (artifacts.ready) {
                  selectedRun = candidate;
                  break;
                }
                const skipReason = artifacts.intentional
                  ? 'intentionally published no release'
                  : `missing or expired publication artifacts: ${artifacts.missing.join(', ')}`;
                core.info(`Skipping run ${candidate.id}: ${skipReason}.`);
              }

              if (!selectedRun) {
                core.setOutput('ready', 'false');
                core.notice(
                  'No successful huntx-production run with unexpired publication artifacts is available; skipping push-triggered republish. The next successful production run will publish automatically.',
                );
                return;
              }
              runId = Number(selectedRun.id);
              expectedAttempt = Number(selectedRun.run_attempt);
            } else {
              core.setFailed(`Unsupported publication event: ${context.eventName}`);
              return;
            }

            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Invalid source workflow run ID: ${runId}`);
              return;
            }
            if (!Number.isSafeInteger(expectedAttempt) || expectedAttempt <= 0) {
              core.setFailed(`Invalid source workflow run attempt: ${expectedAttempt}`);
              return;
            }

            let run = selectedRun;
            if (!run) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              run = response.data;
            }

            if (run.path !== expectedPath || run.name !== 'huntx-production') {
              core.setFailed(
                `Run ${runId} is not the trusted producer: name=${run.name} path=${run.path}`,
              );
              return;
            }
            if (run.head_branch !== 'main') {
              core.setFailed(`Run ${runId} did not execute from main: ${run.head_branch}`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(
                `Run ${runId} is not a completed success: status=${run.status} conclusion=${run.conclusion}`,
              );
              return;
            }
            if (Number(run.run_attempt) !== expectedAttempt) {
              core.setFailed(
                `Attempt mismatch for run ${runId}: expected=${expectedAttempt} current=${run.run_attempt}`,
              );
              return;
            }

            // A successful producer is still stale if code has changed on main.
            // Mirror-generated changes are the only permitted ancestry drift.
            const branchResponse = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const currentMainSHA = branchResponse.data.commit.sha;
            if (run.head_sha !== currentMainSHA) {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: run.head_sha,
                head: currentMainSHA,
                per_page: 100,
              });
              const permittedGeneratedChange = filename =>
                filename.startsWith('outputs/')
                || filename.startsWith('outputs_dev/')
                || filename.startsWith('docs/artifacts/')
                || filename === 'docs/catalog.json'
                || filename === 'docs/assets/js/data.js'
                || filename === 'docs/index.html'
                || filename === '.github/huntx-generated-files.txt';
              const files = comparison.data.files || [];
              const generatedOnly = comparison.data.status === 'ahead'
                && comparison.data.ahead_by > 0
                && comparison.data.ahead_by <= 250
                && files.length > 0
                && files.length < 300
                && files.every(file => permittedGeneratedChange(file.filename)
                  && (!file.previous_filename || permittedGeneratedChange(file.previous_filename)));
              if (!generatedOnly) {
                core.setOutput('ready', 'false');
                core.notice(
                  `Skipping producer ${runId}: main changed beyond generated artifacts since ${run.head_sha}.`,
                );
                return;
              }
            }

            // Keep publication monotonic across manual dispatches and replayed
            // workflow_run events. Idempotent retries of the same source remain valid.
            let previousPublication = null;
            try {
              const prior = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'manifests/publication.json',
                ref: 'generated-outputs',
              });
              if (Array.isArray(prior.data) || prior.data.encoding !== 'base64') {
                throw new Error('generated publication receipt is not a base64 file');
              }
              previousPublication = JSON.parse(Buffer.from(prior.data.content, 'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (previousPublication !== null) {
              const priorId = Number(previousPublication.source_run_id);
              const priorAttempt = Number(previousPublication.source_run_attempt);
              if (!Number.isSafeInteger(priorId) || priorId <= 0
                || !Number.isSafeInteger(priorAttempt) || priorAttempt <= 0) {
                throw new Error('prior publication receipt has invalid source coordinates');
              }
              if (runId < priorId || (runId === priorId && expectedAttempt < priorAttempt)) {
                core.setOutput('ready', 'false');
                core.notice(`Skipping replayed producer ${runId}/${expectedAttempt}; published source is ${priorId}/${priorAttempt}.`);
                return;
              }
            }
            const artifacts = await publicationArtifacts(run);
            if (!artifacts.ready) {
              if (artifacts.intentional) {
                // Recovery manually dispatches the publisher after production.
                // Respect the same explicit no-release verdict as workflow_run:
                // no distributable was approved, so keep the last release.
                core.setOutput('ready', 'false');
                core.notice(
                  `Producer run ${runId} explicitly withheld its release; preserving the current deployment.`,
                );
                return;
              }
              core.setFailed(
                `Run ${runId} is missing unexpired publication artifacts: ${artifacts.missing.join(', ')}`,
              );
              return;
            }

            core.setOutput('ready', 'true');
            core.setOutput('run_id', String(runId));
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput('head_sha', String(run.head_sha));
            core.setOutput('head_branch', String(run.head_branch));
            core.setOutput('created_at', String(run.created_at));
            core.notice(
              `Publishing huntx-production run ${runId}, attempt ${run.run_attempt}, commit ${run.head_sha}, event ${context.eventName}`,
            );

      - name: Checkout publisher control plane
        if: steps.source.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Restore previous generated snapshot
        id: previous
        if: steps.source.outputs.ready == 'true'
        env:
          PREVIOUS_ROOT: ${{ runner.temp }}/huntx-previous-generated
        run: |
          set -euo pipefail
          rm -rf "$PREVIOUS_ROOT"
          remote_sha="$(git ls-remote --heads origin refs/heads/generated-outputs | awk '{print $1}')"
          echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
          if [[ -z "$remote_sha" ]]; then
            mkdir -p "$PREVIOUS_ROOT"
            echo "No previous generated snapshot exists; starting cumulative publication from this run."
            exit 0
          fi
          git fetch --no-tags origin \
            refs/heads/generated-outputs:refs/remotes/origin/generated-outputs
          git worktree add --detach "$PREVIOUS_ROOT" refs/remotes/origin/generated-outputs
          if [[ -s "$PREVIOUS_ROOT/outputs_dev/_manifest.json" ]]; then
            echo "Restored legacy plain cumulative manifest."
          else
            manifest_index="$PREVIOUS_ROOT/outputs_dev/_manifest.json.gz.index.json"
            if [[ ! -s "$manifest_index" ]]; then
              echo "::error title=Previous cumulative manifest missing::Neither a plain manifest nor a compressed manifest index was found."
              exit 1
            fi
            jq -e '.parts | type == "array" and length > 0 and all(.[]; type == "string" and (contains("/") | not) and (contains("\\") | not))' \
              "$manifest_index" >/dev/null
            while IFS= read -r part; do
              test -s "$PREVIOUS_ROOT/outputs_dev/$part"
            done < <(jq -r '.parts[]' "$manifest_index")
            echo "Restored compressed cumulative manifest and all indexed parts."
          fi

      - name: Download verified checkpoint handoff
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-checkpoint-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/huntx-publication/checkpoint
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Download distributable output
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huntx-output-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/huntx-publication/dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Set up Go
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install publisher Python dependencies
        if: steps.source.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip check

      - name: Download structured runtime diagnostics
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huntx-logs-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/huntx-publication/logs
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify current release eligibility and immutable timestamp
        id: release
        if: steps.source.outputs.ready == 'true'
        env:
          PYTHONPATH: src
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          # A source run predating the release-receipt protocol has no
          # receipt; skip it cleanly so the receipt requirement can never
          # turn a preserved deployment red during rollout.
          if [[ ! -s "$SOURCE_ROOT/logs/release-receipt.json" ]]; then
            echo "::notice title=Legacy source run::Run $SOURCE_RUN_ID predates the release-receipt protocol; the current deployment is preserved."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/check_release_eligibility.py             --verify-receipt "$SOURCE_ROOT/logs/release-receipt.json"             --dist "$SOURCE_ROOT/dist"             --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate producer client artifacts against current contracts
        if: steps.release.outputs.ready == 'true'
        env:
          PYTHONPATH: src
          SOURCE_DIST: ${{ runner.temp }}/huntx-publication/dist
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.verify_output import validate_file

          dist = Path(os.environ["SOURCE_DIST"])
          failed = []
          for candidate in sorted(dist.rglob("*")):
              if not candidate.is_file() or candidate.suffix.lower() not in {".json", ".yaml"}:
                  continue
              if candidate.name == "manifest.json":
                  continue
              stats = validate_file(candidate)
              if stats.get("invalid") or stats.get("type") == "empty":
                  failed.append(candidate.relative_to(dist).as_posix())
          if failed:
              raise SystemExit("Release client artifact contract invalid: " + ", ".join(failed))
          PY

      - name: Prepare attributed country and network operator data
        if: steps.release.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Public-domain PDDL server-country and origin-AS range tables,
          # independently checksummed. These populate the dashboard sidecar
          # from the real endpoint IP instead of guessing from the SNI.
          python scripts/prepare_geoip_data.py \
            --output-dir "$RUNNER_TEMP/huntx-geoip" \
            --github-env "$GITHUB_ENV"

      - name: Build verified dashboard data from release dist
        if: steps.release.outputs.ready == 'true'
        env:
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          SOURCE_DIST: ${{ runner.temp }}/huntx-publication/dist
          SOURCE_CREATED_AT: ${{ steps.release.outputs.generated_at }}
          DASHBOARD_ROOT: ${{ runner.temp }}/huntx-dashboard/docs
          HUNTX_FALLBACK_DEV: ${{ runner.temp }}/huntx-publication/empty-dev
          HUNTX_SOURCE_HEALTH_REPORT: ${{ runner.temp }}/huntx-publication/logs/source-health.json
          HUNTX_SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          HUNTX_REQUIRE_PUBLISHED_AUTH: '1'
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools
          rm -rf "${RUNNER_TEMP}/huntx-dashboard"
          mkdir -p "${RUNNER_TEMP}/huntx-dashboard/run"
          cp -a "$SOURCE_DIST/." "${RUNNER_TEMP}/huntx-dashboard/run/dist/"
          .bin/huntx-tools site-data \
            --data-dir "${RUNNER_TEMP}/huntx-dashboard/run" \
            --docs-dir "$DASHBOARD_ROOT" \
            --generated-at "$SOURCE_CREATED_AT"
          test -s "$DASHBOARD_ROOT/catalog.json"
          # Refresh the SPA's baked fallback layer from the SAME verified run so
          # data.js can never advertise stale sample data.
          decoded="$(find "$SOURCE_DIST" -name 'all_sources.json' -print -quit)"
          if [ -z "$decoded" ]; then
            decoded="$(find "$SOURCE_DIST" \( -name 'all_sources.npvt.decoded.json' -o -name 'all_sources_npvt_decoded.json' \) -print -quit)"
          fi
          # Remove checkout's historical data before generating the fallback.
          rm -rf outputs
          mkdir -p outputs
          is_empty_release=false
          if PYTHONPATH=src python scripts/check_release_eligibility.py --empty-release --dist "$SOURCE_DIST"; then
            is_empty_release=true
            echo "Verified explicit empty release: no decoded artifact is required."
          else
            test -n "$decoded" || { echo "::error::decoded artifact missing from checkpoint handoff"; exit 1; }
            cp "$decoded" outputs/all_sources.json
            # The decoded file alone loses the publisher's authenticated
            # HTTPS attestation and hides dropped connections. Copy the
            # canonical URI feed and sidecar from the SAME immutable dist.
            for filename in all_sources.txt all_sources_health.json; do
              candidate="$(find "$SOURCE_DIST" -name "$filename" -print -quit)"
              test -n "$candidate" && test -s "$candidate" || {
                echo "::error title=Missing verified publisher evidence::$filename not found"
                exit 1
              }
              cp "$candidate" "outputs/$filename"
            done
          fi
          # Dev history remains cumulative in the snapshot, never fresh fallback data.
          mkdir -p "$SOURCE_ROOT/empty-dev"
          HUNTX_GENERATED_AT="$SOURCE_CREATED_AT" PYTHONPATH=src python -c 'import os; from pathlib import Path; from scripts import generate_site_data as site; site.generate_dashboard_data(Path("outputs"), Path(os.environ["HUNTX_FALLBACK_DEV"]), Path(os.environ["DASHBOARD_ROOT"]) / "catalog.json", Path(os.environ["DASHBOARD_ROOT"]) / "assets/js/data.js")'
          # An explicit, manifest-verified empty release carries no proxy fleet.
          # Otherwise require fully measured, scored, evidence-backed records.
          if [[ "$is_empty_release" != "true" ]]; then
            HUNTX_REQUIRE_REMARK_GEO_PARITY=1 python scripts/verify_dashboard_telemetry.py "$DASHBOARD_ROOT/assets/js/data.js"
          fi
          cp -a "$DASHBOARD_ROOT/catalog.json" docs/catalog.json
          rm -rf docs/artifacts
          cp -a "$DASHBOARD_ROOT/artifacts" docs/artifacts
          mkdir -p docs/assets/js
          cp "$DASHBOARD_ROOT/assets/js/data.js" docs/assets/js/data.js
          python scripts/update_frontend.py
          test -s docs/assets/js/data.js
          find "$DASHBOARD_ROOT" -type f -printf '%s\t%p\n' | sort -nr | head -50

      - name: Assemble and verify publication snapshot
        if: steps.release.outputs.ready == 'true'
        env:
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          PREVIOUS_ROOT: ${{ runner.temp }}/huntx-previous-generated
          LEGACY_DEV_ROOT: ${{ github.workspace }}/outputs_dev
          DASHBOARD_ROOT: ${{ runner.temp }}/huntx-dashboard/docs
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_HEAD_BRANCH: ${{ steps.source.outputs.head_branch }}
          SOURCE_CREATED_AT: ${{ steps.release.outputs.generated_at }}
        run: |
          set -euo pipefail
          python -m compileall -q scripts/assemble_generated_snapshot.py
          python scripts/assemble_generated_snapshot.py \
            --checkpoint-root "$SOURCE_ROOT/checkpoint" \
            --dist-root "$SOURCE_ROOT/dist" \
            --logs-root "$SOURCE_ROOT/logs" \
            --previous-snapshot-root "$PREVIOUS_ROOT" \
            --legacy-dev-root "$LEGACY_DEV_ROOT" \
            --dashboard-root "$DASHBOARD_ROOT" \
            --shell-root docs \
            --destination "$SOURCE_ROOT/snapshot" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --head-sha "$SOURCE_HEAD_SHA" \
            --head-branch "$SOURCE_HEAD_BRANCH" \
            --source-created-at "$SOURCE_CREATED_AT"
          test -n "$(find "$SOURCE_ROOT/snapshot/outputs" -type f -size +0c -print -quit)"
          test -s "$SOURCE_ROOT/snapshot/outputs_dev/_manifest.json.gz.index.json"
          test -s "$SOURCE_ROOT/snapshot/manifests/main-sync-files.txt"
          # Check the EXACT tree that upload-pages-artifact will package.
          # Producer-side preflight cannot detect assets lost by assembly.
          for required in index.html assets/js/app.js assets/js/control-room.js \
              assets/js/boot-guard.js assets/js/data.js assets/css/tailwind.css \
              assets/css/interface.css assets/css/atlas-v2.css manifest.json sw.js \
              architecture.html network-doctor.html; do
            test -s "$SOURCE_ROOT/snapshot/docs/$required" || {
              echo "::error title=Broken final Pages package::Missing $required"
              exit 1
            }
          done
          # Follow local HTML, JS imports and CSS asset references inside
          # the final assembled upload, not merely the checked-in source.
          python scripts/validate_pages_package.py "$SOURCE_ROOT/snapshot/docs"

      # Reauthenticate only AFTER expensive producer/export/assembler work.
      # This is publisher-only proof; source dist and primary/sub URI inventories
      # remain byte-for-byte unchanged and low-scoring nodes are never curated.
      - name: Install pinned last-mile proxy verification engine
        if: steps.release.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/singbox-publisher.tar.gz"
          echo "e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  $RUNNER_TEMP/singbox-publisher.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/singbox-publisher.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-1.14.3-linux-amd64" >> "$GITHUB_PATH"

      - name: Recheck complete published proxy inventory
        if: steps.release.outputs.ready == 'true'
        env:
          PYTHONPATH: src
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_COMMIT: ${{ steps.source.outputs.head_sha }}
          HUNTX_HEALTH_WORKERS: '32'
          HUNTX_HEALTH_TIMEOUT: '8'
          HUNTX_HEALTH_BUDGET: '900'
        run: |
          set -euo pipefail
          python scripts/publisher_live_attestation.py build \
            --snapshot-root "$SOURCE_ROOT/snapshot" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-commit "$SOURCE_COMMIT" \
            --producer-receipt "$SOURCE_ROOT/logs/release-receipt.json"
          test -s "$SOURCE_ROOT/snapshot/manifests/SHA256SUMS"

      - name: Configure Pages deployment
        if: steps.release.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload cumulative dashboard to Pages
        if: steps.release.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/huntx-publication/snapshot/docs

      - name: Commit atomic generated-only snapshot
        if: steps.release.outputs.ready == 'true'
        env:
          SNAPSHOT_ROOT: ${{ runner.temp }}/huntx-publication/snapshot
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          PYTHONPATH: src
          GIT_SNAPSHOT_ROOT: ${{ runner.temp }}/huntx-publication/git-snapshot
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESTORED_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          # Retire expired publisher claims immediately before committing,
          # never dropping their identities from the immutable public feed.
          python scripts/publisher_live_attestation.py finalize \
            --snapshot-root "$SNAPSHOT_ROOT" \
            --producer-receipt "$SOURCE_ROOT/logs/release-receipt.json"
          # Pages publishes the full sealed snapshot, but generated-outputs
          # deliberately omits seven redundant cumulative-history files.
          # Seal a SECOND digest over the exact Git tree BEFORE checkout
          # cleanup removes the assembler script from this working copy.
          python - "$SNAPSHOT_ROOT" "$GIT_SNAPSHOT_ROOT" <<'PY'
          from pathlib import Path
          from sys import argv
          from scripts.assemble_generated_snapshot import prepare_repository_snapshot
          prepare_repository_snapshot(Path(argv[1]), Path(argv[2]))
          PY
          # The dashboard step regenerates tracked files in-place while
          # assembling the snapshot; this step works on the pristine
          # branches, so discard that working-copy dirt first.
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fdq

          remote_sha="$(git ls-remote --heads origin refs/heads/generated-outputs | awk '{print $1}')"
          if [[ "$remote_sha" != "$RESTORED_SHA" ]]; then
            echo "::error title=Generated snapshot advanced::Restored $RESTORED_SHA but remote is now $remote_sha; rerun to merge the newest cumulative manifest."
            exit 1
          fi

          if [[ -n "$remote_sha" ]]; then
            git fetch --no-tags origin "$remote_sha"
            git checkout -B generated-outputs-next "$remote_sha"
          else
            git checkout --orphan generated-outputs-next
          fi
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          # Exactly the already-verified, Git-specific snapshot; no more
          # file removal or modification after its SHA256SUMS is sealed.
          cp -a "$GIT_SNAPSHOT_ROOT"/. .

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          # Two immutable historical shell files predate this publisher and
          # contain intentional Markdown hard-break whitespace / a final blank
          # line. Preserve their exact bytes rather than rewriting history.
          # Only exempt these two from Git whitespace LINT. Every file,
          # including both, remains in the immutable snapshot SHA256SUMS.
          git diff --cached --check -- . \
            ':(exclude)docs/history/MASTER_FORENSIC_COMPENDIUM.md' \
            ':(exclude)docs/manifest.json'
          for shell_file in docs/history/MASTER_FORENSIC_COMPENDIUM.md docs/manifest.json; do
            cmp -s "$SNAPSHOT_ROOT/$shell_file" "$shell_file" || {
              echo "::error title=Historical shell modified::$shell_file differs from the verified snapshot"
              exit 1
            }
          done
          if git diff --cached --quiet; then
            echo "Generated snapshot is unchanged; branch update is idempotent."
            exit 0
          fi
          git commit -m "Publish HUNTX outputs from run ${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}"

          if [[ -n "$remote_sha" ]]; then
            git push origin HEAD:refs/heads/generated-outputs \
              --force-with-lease="refs/heads/generated-outputs:${remote_sha}"
          else
            git push origin HEAD:refs/heads/generated-outputs
          fi

      - name: Deploy cumulative dashboard to Pages
        if: steps.release.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summarize publication
        if: always()
        run: |
          {
            echo "## Generated output publication"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Publication ready: \`${{ steps.source.outputs.ready || 'false' }}\`"
            echo "- Source run: \`${{ steps.source.outputs.run_id || 'none' }}\`"
            echo "- Source attempt: \`${{ steps.source.outputs.run_attempt || 'none' }}\`"
            echo "- Source commit: \`${{ steps.source.outputs.head_sha || 'none' }}\`"
            echo "- Dashboard data: \`catalog.json + artifacts refreshed from run dist\`"
            echo "- Previous generated commit: \`${{ steps.previous.outputs.sha || 'none' }}\`"
            echo "- Generated data branch: \`generated-outputs\`"
            echo "- Source-branch mirrors: \`none\`"
            echo "- \`outputs/\` scope: source run"
            echo "- \`outputs_dev/\` scope: cumulative across publications and legacy history"
            echo "- Post-publication validation: \`immutable producer receipt + Pages deployment\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
