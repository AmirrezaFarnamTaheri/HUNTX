name: Publish Generated Outputs

on:
  workflow_run:
    workflows:
      - "HUNTX"
      - "huntx"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare generated branch
        run: |
          git fetch origin generated-outputs || true
          git checkout -B generated-outputs origin/generated-outputs || git checkout -B generated-outputs

      - name: Resolve source workflow run
        id: run
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download HUNTX output artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = '${{ steps.run.outputs.run_id }}';
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(runId)
            });

            const artifact = artifacts.data.artifacts.find(
              a => a.name.startsWith('huntx-output-') && !a.expired
            );

            if (!artifact) {
              core.setFailed('No valid huntx-output artifact found');
              return;
            }

            const response = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });

            require('fs').writeFileSync('generated-output.zip', Buffer.from(response.data));

      - name: Extract and validate outputs
        run: |
          set -euo pipefail

          rm -rf outputs outputs_dev manifests run-summary artifact
          mkdir -p outputs outputs_dev manifests run-summary

          unzip -q generated-output.zip -d artifact

          find artifact -type d -name outputs -exec cp -a {}/. outputs/ \;
          find artifact -type d -name outputs_dev -exec cp -a {}/. outputs_dev/ \;

          test -n "$(find outputs -type f -size +0c -print -quit)"
          test -n "$(find outputs_dev -type f -size +0c -print -quit)"

          date -u +%Y-%m-%dT%H:%M:%SZ > manifests/published-at.txt
          echo "${{ github.event.workflow_run.id || github.run_id }}" > manifests/workflow-run-id.txt

      - name: Commit generated snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add outputs outputs_dev manifests run-summary
          git commit -m "Publish generated HUNTX outputs" || echo "No generated changes"
          git push origin generated-outputs
