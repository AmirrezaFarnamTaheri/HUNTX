name: Publish Generated Outputs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-generated-outputs.yml"
      - ".github/huntx-generated-files.txt"
      - "scripts/assemble_generated_snapshot.py"
      - "scripts/sync_generated_outputs_to_main.py"
  workflow_run:
    workflows:
      - huntx-production
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful huntx-production workflow run ID to republish
        required: true
        type: string
      source_run_attempt:
        description: Current attempt number for the source run
        required: true
        default: "1"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-generated-outputs
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified generated snapshot
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Resolve and validate source run
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const expectedPath = '.github/workflows/huntx.yml';

            const requiredArtifactNames = run => [
              `runtime-checkpoint-${run.id}-${run.run_attempt}`,
              `huntx-output-${run.id}-${run.run_attempt}`,
              `huntx-logs-${run.id}-${run.run_attempt}`,
            ];

            function noReleaseVerdictName(run) {
              return `huntx-no-release-${run.id}-${run.run_attempt}`;
            }

            // A run that deliberately withheld a release uploads an explicit
            // no-release verdict. That lets the publisher tell an intentional
            // "nothing to publish" (safety net or degraded producer) from a
            // genuinely anomalous missing artifact.
            async function publicationArtifacts(run) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(run.id),
                per_page: 100,
              });
              const available = new Set(
                data.artifacts
                  .filter(artifact => !artifact.expired)
                  .map(artifact => artifact.name),
              );
              const missing = requiredArtifactNames(run).filter(
                name => !available.has(name),
              );
              const intentional = !available.has(`huntx-output-${run.id}-${run.run_attempt}`)
                && available.has(noReleaseVerdictName(run));
              return { ready: missing.length === 0, missing, intentional };
            }

            let runId;
            let expectedAttempt;
            let selectedRun = null;

            if (context.eventName === 'workflow_run') {
              runId = Number(context.payload.workflow_run.id);
              expectedAttempt = Number(context.payload.workflow_run.run_attempt);
              const trigger = await publicationArtifacts({ id: runId, run_attempt: expectedAttempt });
              if (!trigger.ready) {
                if (trigger.intentional) {
                  core.setOutput('ready', 'false');
                  core.notice(
                    `Producer run ${runId} intentionally published no release; the current deployment is preserved.`,
                  );
                  return;
                }
                core.setFailed(
                  `Run ${runId} is missing required publication artifacts: ${trigger.missing.join(', ')}`,
                );
                return;
              }
            } else if (context.eventName === 'workflow_dispatch') {
              runId = Number('${{ inputs.source_run_id }}');
              expectedAttempt = Number('${{ inputs.source_run_attempt }}');
            } else if (context.eventName === 'push') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'huntx.yml',
                branch: 'main',
                status: 'completed',
                per_page: 50,
              });

              for (const candidate of data.workflow_runs) {
                if (
                  candidate.conclusion !== 'success'
                  || candidate.path !== expectedPath
                  || candidate.name !== 'huntx-production'
                ) {
                  continue;
                }
                const artifacts = await publicationArtifacts(candidate);
                if (artifacts.ready) {
                  selectedRun = candidate;
                  break;
                }
                const skipReason = artifacts.intentional
                  ? 'intentionally published no release'
                  : `missing or expired publication artifacts: ${artifacts.missing.join(', ')}`;
                core.info(`Skipping run ${candidate.id}: ${skipReason}.`);
              }

              if (!selectedRun) {
                core.setOutput('ready', 'false');
                core.notice(
                  'No successful huntx-production run with unexpired publication artifacts is available; skipping push-triggered republish. The next successful production run will publish automatically.',
                );
                return;
              }
              runId = Number(selectedRun.id);
              expectedAttempt = Number(selectedRun.run_attempt);
            } else {
              core.setFailed(`Unsupported publication event: ${context.eventName}`);
              return;
            }

            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Invalid source workflow run ID: ${runId}`);
              return;
            }
            if (!Number.isSafeInteger(expectedAttempt) || expectedAttempt <= 0) {
              core.setFailed(`Invalid source workflow run attempt: ${expectedAttempt}`);
              return;
            }

            let run = selectedRun;
            if (!run) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              run = response.data;
            }

            if (run.path !== expectedPath || run.name !== 'huntx-production') {
              core.setFailed(
                `Run ${runId} is not the trusted producer: name=${run.name} path=${run.path}`,
              );
              return;
            }
            if (run.head_branch !== 'main') {
              core.setFailed(`Run ${runId} did not execute from main: ${run.head_branch}`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(
                `Run ${runId} is not a completed success: status=${run.status} conclusion=${run.conclusion}`,
              );
              return;
            }
            if (Number(run.run_attempt) !== expectedAttempt) {
              core.setFailed(
                `Attempt mismatch for run ${runId}: expected=${expectedAttempt} current=${run.run_attempt}`,
              );
              return;
            }

            const artifacts = await publicationArtifacts(run);
            if (!artifacts.ready) {
              core.setFailed(
                `Run ${runId} is missing unexpired publication artifacts: ${artifacts.missing.join(', ')}`,
              );
              return;
            }

            core.setOutput('ready', 'true');
            core.setOutput('run_id', String(runId));
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput('head_sha', String(run.head_sha));
            core.setOutput('head_branch', String(run.head_branch));
            core.setOutput('created_at', String(run.created_at));
            core.notice(
              `Publishing huntx-production run ${runId}, attempt ${run.run_attempt}, commit ${run.head_sha}, event ${context.eventName}`,
            );

      - name: Checkout publisher control plane
        if: steps.source.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Restore previous generated snapshot
        id: previous
        if: steps.source.outputs.ready == 'true'
        env:
          PREVIOUS_ROOT: ${{ runner.temp }}/huntx-previous-generated
        run: |
          set -euo pipefail
          rm -rf "$PREVIOUS_ROOT"
          remote_sha="$(git ls-remote --heads origin refs/heads/generated-outputs | awk '{print $1}')"
          echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
          if [[ -z "$remote_sha" ]]; then
            mkdir -p "$PREVIOUS_ROOT"
            echo "No previous generated snapshot exists; starting cumulative publication from this run."
            exit 0
          fi
          git fetch --no-tags origin \
            refs/heads/generated-outputs:refs/remotes/origin/generated-outputs
          git worktree add --detach "$PREVIOUS_ROOT" refs/remotes/origin/generated-outputs
          test -s "$PREVIOUS_ROOT/outputs_dev/_manifest.json"

      - name: Download verified checkpoint handoff
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-checkpoint-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/huntx-publication/checkpoint
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Download distributable output
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: huntx-output-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/huntx-publication/dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Set up Go
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download structured runtime diagnostics
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: huntx-logs-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/huntx-publication/logs
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify current release eligibility and immutable timestamp
        id: release
        if: steps.source.outputs.ready == 'true'
        env:
          PYTHONPATH: src
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          # A source run predating the release-receipt protocol has no
          # receipt; skip it cleanly so the receipt requirement can never
          # turn a preserved deployment red during rollout.
          if [[ ! -s "$SOURCE_ROOT/logs/release-receipt.json" ]]; then
            echo "::notice title=Legacy source run::Run $SOURCE_RUN_ID predates the release-receipt protocol; the current deployment is preserved."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/check_release_eligibility.py             --verify-receipt "$SOURCE_ROOT/logs/release-receipt.json"             --dist "$SOURCE_ROOT/dist"             --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Build verified dashboard data from release dist
        if: steps.source.outputs.ready == 'true'
        env:
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          SOURCE_DIST: ${{ runner.temp }}/huntx-publication/dist
          SOURCE_CREATED_AT: ${{ steps.release.outputs.generated_at }}
          DASHBOARD_ROOT: ${{ runner.temp }}/huntx-dashboard/docs
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools
          rm -rf "${RUNNER_TEMP}/huntx-dashboard"
          mkdir -p "${RUNNER_TEMP}/huntx-dashboard/run"
          cp -a "$SOURCE_DIST/." "${RUNNER_TEMP}/huntx-dashboard/run/dist/"
          .bin/huntx-tools site-data \
            --data-dir "${RUNNER_TEMP}/huntx-dashboard/run" \
            --docs-dir "$DASHBOARD_ROOT" \
            --generated-at "$SOURCE_CREATED_AT"
          test -s "$DASHBOARD_ROOT/catalog.json"
          # Refresh the SPA's baked fallback layer from the SAME verified run so
          # bundle.js can never advertise stale sample data.
          decoded="$(find "$SOURCE_DIST" \( -name 'all_sources.npvt.decoded.json' -o -name 'all_sources_npvt_decoded.json' \) -print -quit)"
          # Remove checkout's historical data before generating the fallback.
          rm -rf outputs
          mkdir -p outputs
          if PYTHONPATH=src python scripts/check_release_eligibility.py --empty-release --dist "$SOURCE_DIST"; then
            echo "Verified explicit empty release: no decoded artifact is required."
          else
            test -n "$decoded" || { echo "::error::decoded artifact missing from checkpoint handoff"; exit 1; }
            cp "$decoded" outputs/all_sources.npvt.decoded.json
          fi
          # Dev history remains cumulative in the snapshot, never fresh fallback data.
          mkdir -p "$SOURCE_ROOT/empty-dev"
          HUNTX_GENERATED_AT="$SOURCE_CREATED_AT" HUNTX_FALLBACK_DEV="$SOURCE_ROOT/empty-dev" \
            python -c 'import os; from pathlib import Path; from scripts import generate_site_data as site; site.OUTPUTS_DEV_DIR = Path(os.environ["HUNTX_FALLBACK_DEV"]); site.main()'
          cp -a "$DASHBOARD_ROOT/catalog.json" docs/catalog.json
          rm -rf docs/artifacts
          cp -a "$DASHBOARD_ROOT/artifacts" docs/artifacts
          python scripts/update_frontend.py
          test -s docs/assets/js/data.js
          find "$DASHBOARD_ROOT" -type f -printf '%s\t%p\n' | sort -nr | head -50

      - name: Download structured runtime diagnostics
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: huntx-logs-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/huntx-publication/logs
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Assemble and verify publication snapshot
        if: steps.source.outputs.ready == 'true'
        env:
          SOURCE_ROOT: ${{ runner.temp }}/huntx-publication
          PREVIOUS_ROOT: ${{ runner.temp }}/huntx-previous-generated
          LEGACY_DEV_ROOT: ${{ github.workspace }}/outputs_dev
          DASHBOARD_ROOT: ${{ runner.temp }}/huntx-dashboard/docs
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_HEAD_BRANCH: ${{ steps.source.outputs.head_branch }}
          SOURCE_CREATED_AT: ${{ steps.release.outputs.generated_at }}
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/assemble_generated_snapshot.py \
            scripts/sync_generated_outputs_to_main.py
          python scripts/assemble_generated_snapshot.py \
            --checkpoint-root "$SOURCE_ROOT/checkpoint" \
            --dist-root "$SOURCE_ROOT/dist" \
            --logs-root "$SOURCE_ROOT/logs" \
            --previous-snapshot-root "$PREVIOUS_ROOT" \
            --legacy-dev-root "$LEGACY_DEV_ROOT" \
            --dashboard-root "$DASHBOARD_ROOT" \
            --shell-root docs \
            --destination "$SOURCE_ROOT/snapshot" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --head-sha "$SOURCE_HEAD_SHA" \
            --head-branch "$SOURCE_HEAD_BRANCH" \
            --source-created-at "$SOURCE_CREATED_AT"
          test -n "$(find "$SOURCE_ROOT/snapshot/outputs" -type f -size +0c -print -quit)"
          test -s "$SOURCE_ROOT/snapshot/outputs_dev/_manifest.json"
          test -s "$SOURCE_ROOT/snapshot/manifests/main-sync-files.txt"

      - name: Commit atomic generated-only snapshot
        if: steps.source.outputs.ready == 'true'
        env:
          SNAPSHOT_ROOT: ${{ runner.temp }}/huntx-publication/snapshot
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESTORED_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          # The dashboard step regenerates tracked files in-place while
          # assembling the snapshot; this step works on the pristine
          # branches, so discard that working-copy dirt first.
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fdq

          remote_sha="$(git ls-remote --heads origin refs/heads/generated-outputs | awk '{print $1}')"
          if [[ "$remote_sha" != "$RESTORED_SHA" ]]; then
            echo "::error title=Generated snapshot advanced::Restored $RESTORED_SHA but remote is now $remote_sha; rerun to merge the newest cumulative manifest."
            exit 1
          fi

          if [[ -n "$remote_sha" ]]; then
            git fetch --no-tags origin "$remote_sha"
            git checkout -B generated-outputs-next "$remote_sha"
          else
            git checkout --orphan generated-outputs-next
          fi
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a "$SNAPSHOT_ROOT"/. .

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated snapshot is unchanged; branch update is idempotent."
            exit 0
          fi
          git commit -m "Publish HUNTX outputs from run ${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}"

          if [[ -n "$remote_sha" ]]; then
            git push origin HEAD:refs/heads/generated-outputs \
              --force-with-lease="refs/heads/generated-outputs:${remote_sha}"
          else
            git push origin HEAD:refs/heads/generated-outputs
          fi

      - name: Mirror verified outputs to main
        if: steps.source.outputs.ready == 'true'
        env:
          SNAPSHOT_ROOT: ${{ runner.temp }}/huntx-publication/snapshot
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            git checkout -B generated-main-sync refs/remotes/origin/main
            python scripts/sync_generated_outputs_to_main.py \
              --snapshot-root "$SNAPSHOT_ROOT" \
              --repo-root "$GITHUB_WORKSPACE" \
              --inventory-path .github/huntx-generated-files.txt

            test -n "$(find outputs -type f -size +0c -print -quit)"
            test -s outputs_dev/_manifest.json
            test -f scripts/verify_output.py

            git add -- outputs outputs_dev docs .github/huntx-generated-files.txt
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "Main output mirror is already current."
              exit 0
            fi

            git commit -m "Update HUNTX outputs from run ${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi

            if (( attempt == 3 )); then
              echo "::error title=Main output mirror failed::Could not update main after 3 concurrency-safe attempts."
              exit 1
            fi
            git reset --hard
            git clean -fd -- outputs outputs_dev
            sleep $((attempt * 2))
          done

      - name: Validate resulting main head
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected_sha" || {
            echo "::error title=Main validation unavailable::Could not resolve refs/heads/main after publication."
            exit 1
          }

          runs_url="repos/${GH_REPO}/actions/workflows/pr-validation.yml/runs?branch=main&per_page=30"
          before_id="$(gh api "$runs_url" | jq -r '[.workflow_runs[] | select(.event == "workflow_dispatch") | .id] | max // 0')"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Dispatching pull-request-validation for published main head $expected_sha."
          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/pr-validation.yml/dispatches" \
            -f ref=main

          validation_id=""
          for _ in $(seq 1 30); do
            runs="$(gh api "$runs_url")"
            validation_id="$(jq -r \
              --argjson before "$before_id" \
              --arg started "$started_at" \
              --arg expected "$expected_sha" \
              '[.workflow_runs[]
                | select(.event == "workflow_dispatch")
                | select(.id > $before)
                | select(.created_at >= $started)
                | select(.head_sha == $expected)]
               | sort_by(.created_at)
               | .[0].id // empty' <<<"$runs")"
            if [[ -n "$validation_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$validation_id" ]]; then
            echo "::error title=Main validation not observable::pr-validation was dispatched for $expected_sha but no matching run appeared."
            exit 1
          fi

          echo "Captured pull-request-validation run $validation_id for $expected_sha."
          for _ in $(seq 1 180); do
            run="$(gh api "repos/${GH_REPO}/actions/runs/${validation_id}")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            echo "validation run $validation_id: status=$status conclusion=${conclusion:-pending}"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "::error title=Published main validation failed::pull-request-validation run $validation_id concluded $conclusion."
                exit 1
              fi
              echo "Published main head $expected_sha passed pull-request-validation."
              exit 0
            fi
            sleep 10
          done

          echo "::error title=Published main validation timed out::pull-request-validation run $validation_id did not complete within the validation window."
          exit 1

      - name: Summarize publication
        if: always()
        run: |
          {
            echo "## Generated output publication"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Publication ready: \`${{ steps.source.outputs.ready || 'false' }}\`"
            echo "- Source run: \`${{ steps.source.outputs.run_id || 'none' }}\`"
            echo "- Source attempt: \`${{ steps.source.outputs.run_attempt || 'none' }}\`"
            echo "- Source commit: \`${{ steps.source.outputs.head_sha || 'none' }}\`"
            echo "- Dashboard data: \`catalog.json + artifacts refreshed from run dist\`"
            echo "- Previous generated commit: \`${{ steps.previous.outputs.sha || 'none' }}\`"
            echo "- Generated data branch: \`generated-outputs\`"
            echo "- Source-branch mirrors: \`main/outputs\`, \`main/outputs_dev\`"
            echo "- \`outputs/\` scope: source run"
            echo "- \`outputs_dev/\` scope: cumulative across publications and legacy history"
            echo "- Post-publication main validation: \`pull-request-validation\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
