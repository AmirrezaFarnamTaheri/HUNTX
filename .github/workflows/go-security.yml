name: go-security

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "src/huntx/connectors/v2ray_collector/**"
      - ".github/workflows/go-security.yml"
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: go-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: root-and-nested-go-modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate root module
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Validate nested collector module
        working-directory: src/huntx/connectors/v2ray_collector
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
