name: apply-mypy-fix

on:
  push:
    branches:
      - fix/huntx-synthesis-hardening-20260712
    paths:
      - .github/workflows/apply-mypy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/huntx-synthesis-hardening-20260712
          persist-credentials: true

      - name: Apply reviewed type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path("src/huntx/formats/proxy_uri_validator.py")
          text = validator.read_text(encoding="utf-8")
          old = '        port = int(payload.get("port"))\n'
          new = (
              '        raw_port = payload.get("port")\n'
              '        if not isinstance(raw_port, (str, int)):\n'
              '            return False\n'
              '        port = int(raw_port)\n'
          )
          if old not in text:
              raise SystemExit("validator target not found")
          validator.write_text(text.replace(old, new, 1), encoding="utf-8")

          governed = Path("src/huntx/pipeline/governed_build.py")
          text = governed.read_text(encoding="utf-8")
          text = text.replace("from typing import Any\n", "from typing import Any, cast\n", 1)
          old = (
              "        self.state_repo = _GovernedRepoProxy(\n"
              "            original_repo,\n"
              "            publication_tier=tier,\n"
              "            require_fresh_probe=require_fresh_probe,\n"
              "        )\n"
          )
          new = (
              "        self.state_repo = cast(Any, _GovernedRepoProxy(\n"
              "            original_repo,\n"
              "            publication_tier=tier,\n"
              "            require_fresh_probe=require_fresh_probe,\n"
              "        ))\n"
          )
          if old not in text:
              raise SystemExit("governed build target not found")
          governed.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify mypy
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install mypy types-requests types-PyYAML
          pip install --no-deps -e .
          mypy src/huntx

      - name: Commit fixes and remove workflow
        run: |
          rm .github/workflows/apply-mypy-fix.yml
          git config user.name "huntx-ci-fix"
          git config user.email "huntx-ci-fix@users.noreply.github.com"
          git add src/huntx/formats/proxy_uri_validator.py src/huntx/pipeline/governed_build.py .github/workflows/apply-mypy-fix.yml
          git commit -m "fix: resolve governed build type errors"
          git push origin HEAD:fix/huntx-synthesis-hardening-20260712
