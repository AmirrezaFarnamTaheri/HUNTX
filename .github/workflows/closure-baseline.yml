name: closure-baseline

on:
  push:
    branches:
      - fix/huntx-synthesis-hardening-20260712
    paths:
      - .github/workflows/closure-baseline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/huntx-synthesis-hardening-20260712
          persist-credentials: true

      - name: Apply verified closure baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_formats_coverage.py')
          s = p.read_text()
          s = s.replace(
              'content = b"vless://uuid@host:443?key=val#remark\\nvmess://base64"',
              'content = b"vless://11111111-1111-4111-8111-111111111111@proxy.example.com:443?type=tcp#remark\\nss://YWVzLTI1Ni1nY206cGFzc3dvcmQ=@proxy.example.net:8388"',
          )
          s = s.replace(
              'self.assertEqual(lines[0]["data"]["line"], "vless://uuid@host:443?key=val")',
              'self.assertEqual(lines[0]["data"]["line"], "vless://11111111-1111-4111-8111-111111111111@proxy.example.com:443?type=tcp")',
          )
          s = s.replace('self.assertIn(b"vmess://", built)', 'self.assertIn(b"ss://", built)', 1)
          p.write_text(s)

          p = Path('tests/test_remark_stripping.py')
          s = p.read_text()
          replacements = {
              '"vless://uuid@1.2.3.4:443?type=tcp#Channel_A\\n"': '"vless://11111111-1111-4111-8111-111111111111@proxy.example.com:443?type=tcp#Channel_A\\n"',
              '"vless://uuid@1.2.3.4:443?type=tcp#Channel_B\\n"': '"vless://11111111-1111-4111-8111-111111111111@proxy.example.com:443?type=tcp#Channel_B\\n"',
              '"vless://uuid@1.2.3.4:443?type=tcp#Channel_C\\n"': '"vless://11111111-1111-4111-8111-111111111111@proxy.example.com:443?type=tcp#Channel_C\\n"',
              'base = {"v": "2", "add": "1.2.3.4", "port": "443", "id": "uuid",\n                "aid": "0", "net": "ws", "type": "none"}': 'base = {"v": "2", "add": "proxy.example.com", "port": "443",\n                "id": "11111111-1111-4111-8111-111111111111",\n                "aid": "0", "net": "ws", "type": "none"}',
              '"vless://uuid1@1.2.3.4:443#A\\n"': '"vless://11111111-1111-4111-8111-111111111111@proxy-one.example.com:443#A\\n"',
              '"vless://uuid2@5.6.7.8:443#A\\n"': '"vless://22222222-2222-4222-8222-222222222222@proxy-two.example.com:443#A\\n"',
              '"vless://a@1.2.3.4:443#Old_Remark\\n"': '"vless://11111111-1111-4111-8111-111111111111@proxy.example.com:443#Old_Remark\\n"',
              '"trojan://b@5.6.7.8:443#Another_Remark\\n"': '"trojan://secret@proxy.example.net:443#Another_Remark\\n"',
              '"vless://uuid@host:443"': '"vless://11111111-1111-4111-8111-111111111111@proxy.example.com:443"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('.github/workflows/pr-validation.yml')
          s = p.read_text()
          s = s.replace('cache-dependency-path: requirements.txt', 'cache-dependency-path: requirements-dev.txt')
          s = s.replace(
              'pip install --require-hashes -r requirements.txt\n          pip install flake8 mypy pytest types-requests types-PyYAML',
              'pip install --require-hashes -r requirements-dev.txt',
          )
          marker = '''      - name: Upload pytest report\n'''
          supply = '''      - name: Generate SBOM and provenance\n        if: always()\n        run: |\n          python scripts/generate_sbom.py artifacts/sbom.cdx.json\n          python scripts/generate_provenance.py artifacts artifacts/provenance.json\n\n      - name: Upload supply-chain evidence\n        if: always()\n        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3\n        with:\n          name: supply-chain-evidence\n          path: artifacts/\n          if-no-files-found: error\n          retention-days: 30\n\n'''
          if 'Generate SBOM and provenance' not in s:
              s = s.replace(marker, supply + marker)
          p.write_text(s)
          PY

          cat > scripts/generate_sbom.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import hashlib
          import importlib.metadata
          import json
          import pathlib
          import sys

          def main() -> int:
              out = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else 'artifacts/sbom.cdx.json')
              components = []
              for dist in sorted(importlib.metadata.distributions(), key=lambda d: (d.metadata.get('Name', '').lower(), d.version)):
                  name = dist.metadata.get('Name')
                  if name:
                      components.append({'type': 'library', 'name': name, 'version': dist.version, 'purl': f'pkg:pypi/{name.lower()}@{dist.version}'})
              serial = hashlib.sha256(json.dumps(components, sort_keys=True).encode()).hexdigest()[:32]
              doc = {'bomFormat': 'CycloneDX', 'specVersion': '1.5', 'serialNumber': 'urn:uuid:' + serial, 'version': 1, 'components': components}
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              return 0

          if __name__ == '__main__':
              raise SystemExit(main())
          PY

          cat > scripts/generate_provenance.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import time

          def sha256(path: pathlib.Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def main() -> int:
              root = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else 'artifacts')
              out = pathlib.Path(sys.argv[2] if len(sys.argv) > 2 else 'artifacts/provenance.json')
              subjects = [{'name': str(p.relative_to(root)), 'digest': {'sha256': sha256(p)}} for p in sorted(root.rglob('*')) if p.is_file() and p != out]
              doc = {'_type': 'https://in-toto.io/Statement/v1', 'subject': subjects, 'predicateType': 'https://slsa.dev/provenance/v1', 'predicate': {'buildDefinition': {'buildType': 'https://github.com/AmirrezaFarnamTaheri/HUNTX/actions', 'externalParameters': {'ref': os.getenv('GITHUB_REF', ''), 'sha': os.getenv('GITHUB_SHA', '')}}, 'runDetails': {'builder': {'id': 'https://github.com/actions/runner'}, 'metadata': {'invocationId': os.getenv('GITHUB_RUN_ID', 'local'), 'startedOn': int(time.time())}}}}
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              return 0

          if __name__ == '__main__':
              raise SystemExit(main())
          PY

          python -m pip install --upgrade pip
          pip install pip-tools
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements-dev.txt requirements-dev.in
          rm -f .github/workflows/dev-lock-generation.yml .github/workflows/closure-baseline.yml

      - name: Verify baseline
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
          python -m compileall -q src tests
          flake8 src/huntx tests --count --select=E9,F63,F7,F82 --show-source --statistics
          mypy src/huntx
          pytest -q tests/
          python scripts/generate_sbom.py artifacts/sbom.cdx.json
          python scripts/generate_provenance.py artifacts artifacts/provenance.json
          python -m json.tool artifacts/sbom.cdx.json >/dev/null
          python -m json.tool artifacts/provenance.json >/dev/null

      - name: Commit baseline
        run: |
          set -euo pipefail
          git config user.name 'huntx-ci-fix'
          git config user.email 'huntx-ci-fix@users.noreply.github.com'
          git add .github/workflows/pr-validation.yml .github/workflows/dev-lock-generation.yml .github/workflows/closure-baseline.yml requirements-dev.txt scripts/generate_sbom.py scripts/generate_provenance.py tests/test_formats_coverage.py tests/test_remark_stripping.py
          git commit -m 'ci: lock validation and generate supply-chain evidence'
          git push origin HEAD:fix/huntx-synthesis-hardening-20260712
