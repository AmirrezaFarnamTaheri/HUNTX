name: huntx-production

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Parallel ingestion workers (1-16)"
        required: false
        default: "2"
      msg_fresh_hours:
        description: "First-run text lookback hours"
        required: false
        default: "2"
      file_fresh_hours:
        description: "First-run media lookback hours"
        required: false
        default: "48"
      msg_subsequent_hours:
        description: "Later text lookback hours (0=all unseen)"
        required: false
        default: "0"
      file_subsequent_hours:
        description: "Later media lookback hours (0=all unseen)"
        required: false
        default: "0"
      reset:
        description: "Start a new state generation"
        required: false
        type: boolean
        default: false
      reset_confirm:
        description: "Type RESET-HUNTX-STATE exactly"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: huntx-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MAX_WORKERS: ${{ github.event.inputs.max_workers || '2' }}
  MSG_FRESH_HOURS: ${{ github.event.inputs.msg_fresh_hours || '2' }}
  FILE_FRESH_HOURS: ${{ github.event.inputs.file_fresh_hours || '48' }}
  MSG_SUBSEQUENT_HOURS: ${{ github.event.inputs.msg_subsequent_hours || '0' }}
  FILE_SUBSEQUENT_HOURS: ${{ github.event.inputs.file_subsequent_hours || '0' }}
  HUNTX_RUN_TIMEOUT: "5400"
  HUNTX_COMPLETION_BUFFER: "900"
  HUNTX_CANONICAL_RESOLVE_TIMEOUT: "20"
  HUNTX_TELEGRAM_CLEANUP_TIMEOUT: "10"
  HUNTX_SOURCE_TIMEOUT: "600"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_PREFER_BINARY: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: production-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@8f19afcc704763637be6b1718da0af52ca05785d # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate Go release plane
        run: |
          set -euo pipefail
          formatting="$(gofmt -l .)"
          test -z "$formatting" || {
            printf 'Unformatted Go files:\n%s\n' "$formatting"
            exit 1
          }
          go test -race ./...
          go vet ./...
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install and validate
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary flake8 mypy pytest pytest-asyncio types-requests types-PyYAML
          python -m pip install --no-deps -e .
          python -m pip check
          python -m compileall -q -j 0 src tests scripts
          python -m flake8 src/huntx tests scripts --count --statistics
          python -m mypy src/huntx
          python -m pytest -q --strict-config --strict-markers --durations=20 --junitxml=pytest-results.xml

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7

  restore:
    name: restore-verified-state
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - name: Checkout integrity verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@8f19afcc704763637be6b1718da0af52ca05785d # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build integrity verifier
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools

      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Restore and verify immutable generation
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          mkdir -p state-input/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}
          touch state-input/.state-bundle
          if [[ -z "$S3_BUCKET" ]]; then
            echo "Stateless run: no S3 bucket configured."
            exit 0
          fi

          aws sts get-caller-identity --no-cli-pager >/dev/null
          if ! aws s3 cp "s3://$S3_BUCKET/current.json" current.json --only-show-errors; then
            echo "No current generation; starting fresh."
            exit 0
          fi

          generation="$(.bin/huntx-tools runtime-generation validate-pointer --pointer current.json)"
          aws s3 cp \
            "s3://$S3_BUCKET/generations/$generation/manifest.json" \
            generation-manifest.json --only-show-errors
          .bin/huntx-tools runtime-generation validate-pointer \
            --pointer current.json \
            --manifest generation-manifest.json >/dev/null
          rm -rf state-input
          mkdir state-input
          aws s3 sync \
            "s3://$S3_BUCKET/generations/$generation/payload" \
            state-input --only-show-errors
          .bin/huntx-tools runtime-generation verify \
            --root state-input \
            --manifest generation-manifest.json
          mkdir -p state-input/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}
          touch state-input/.state-bundle

      - name: Back up reset pointer and clear restored state
        if: ${{ inputs.reset == true }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.reset_confirm }}" != "RESET-HUNTX-STATE" ]]; then
            echo "::error title=Reset not confirmed::reset_confirm must exactly match RESET-HUNTX-STATE"
            exit 2
          fi
          if [[ -n "$S3_BUCKET" && -f current.json ]]; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_key="backups/$stamp/current.json"
            aws s3 cp current.json "s3://$S3_BUCKET/$backup_key" --only-show-errors
            aws s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "$backup_key" \
              --no-cli-pager >/dev/null
          fi
          rm -rf state-input
          mkdir -p state-input/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}
          touch state-input/.state-bundle

      - name: Upload state handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-state-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: state-input/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  run:
    name: ingest-build-package
    needs: restore
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: read
    outputs:
      checkpoint_ready: ${{ steps.checkpoint.outputs.ready }}
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          require_uint() {
            local name="$1" value="$2" maximum="$3"
            if ! [[ "$value" =~ ^[0-9]+$ ]] || (( 10#$value > maximum )); then
              echo "::error title=Invalid input::$name must be an integer from 0 to $maximum"
              exit 2
            fi
          }
          require_uint max_workers "$MAX_WORKERS" 16
          (( 10#$MAX_WORKERS >= 1 )) || exit 2
          require_uint msg_fresh_hours "$MSG_FRESH_HOURS" 720
          require_uint file_fresh_hours "$FILE_FRESH_HOURS" 720
          require_uint msg_subsequent_hours "$MSG_SUBSEQUENT_HOURS" 720
          require_uint file_subsequent_hours "$FILE_SUBSEQUENT_HOURS" 720

      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@8f19afcc704763637be6b1718da0af52ca05785d # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release tools
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Download restored state
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: runtime-state-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist

      - name: Run HuntX with controlled watchdog
        id: runtime
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PUBLISH_BOT_TOKEN: ${{ secrets.PUBLISH_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          HUNTX_MAX_WORKERS: ${{ env.MAX_WORKERS }}
          LOG_LEVEL: INFO
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 105m \
            huntx \
              --config configs/config.prod.yaml \
              --data-dir persist/data \
              --db-path persist/state.db \
              run \
              --msg-fresh-hours "$MSG_FRESH_HOURS" \
              --file-fresh-hours "$FILE_FRESH_HOURS" \
              --msg-subsequent-hours "$MSG_SUBSEQUENT_HOURS" \
              --file-subsequent-hours "$FILE_SUBSEQUENT_HOURS"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify and package output
        if: steps.runtime.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          .bin/huntx-tools verify-output --data-dir persist/data
          .bin/huntx-tools site-data --data-dir persist/data --docs-dir docs

      - name: Build verified checkpoint handoff
        if: always()
        id: checkpoint
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          python scripts/checkpoint_runtime_state.py \
            --db persist/state.db \
            --raw-dir persist/data/raw

          generation="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p checkpoint-package/payload/data
          cp persist/state.db checkpoint-package/payload/state.db
          for directory in raw archive outputs outputs_dev state; do
            if [[ -d "persist/data/$directory" ]]; then
              cp -a "persist/data/$directory" checkpoint-package/payload/data/
            fi
          done
          .bin/huntx-tools runtime-generation build \
            --root checkpoint-package/payload \
            --generation "$generation" \
            --manifest checkpoint-package/generation-manifest.json \
            --pointer checkpoint-package/next-current.json
          .bin/huntx-tools runtime-generation verify \
            --root checkpoint-package/payload \
            --manifest checkpoint-package/generation-manifest.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload checkpoint handoff
        if: steps.checkpoint.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkpoint-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload distributable output
        if: steps.runtime.outputs.exit_code == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huntx-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist/data/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huntx-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist/data/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Pages artifact
        if: steps.runtime.outputs.exit_code == '0'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

      - name: Enforce runtime result after checkpoint
        if: always()
        run: |
          set -euo pipefail
          [[ "${{ steps.checkpoint.outputs.ready || 'false' }}" == "true" ]]
          rc="${{ steps.runtime.outputs.exit_code || '1' }}"
          (( rc == 0 )) || exit "$rc"

  persist:
    name: persist-immutable-state
    needs: run
    if: ${{ always() && needs.run.outputs.checkpoint_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - name: Checkout integrity verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@8f19afcc704763637be6b1718da0af52ca05785d # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build integrity verifier
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools

      - name: Download checkpoint handoff
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: runtime-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkpoint-package

      - name: Reverify checkpoint
        id: generation
        run: |
          set -euo pipefail
          generation="$(.bin/huntx-tools runtime-generation validate-pointer \
            --pointer checkpoint-package/next-current.json \
            --manifest checkpoint-package/generation-manifest.json)"
          .bin/huntx-tools runtime-generation verify \
            --root checkpoint-package/payload \
            --manifest checkpoint-package/generation-manifest.json
          echo "id=$generation" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload generation then atomically advance pointer
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          if [[ -z "$S3_BUCKET" ]]; then
            echo "No S3 bucket configured; verified checkpoint remains ephemeral."
            exit 0
          fi
          generation="${{ steps.generation.outputs.id }}"
          prefix="generations/$generation"
          aws sts get-caller-identity --no-cli-pager >/dev/null
          aws s3 sync checkpoint-package/payload \
            "s3://$S3_BUCKET/$prefix/payload" \
            --no-follow-symlinks --only-show-errors
          aws s3 cp checkpoint-package/generation-manifest.json \
            "s3://$S3_BUCKET/$prefix/manifest.json" --only-show-errors
          aws s3 cp "s3://$S3_BUCKET/$prefix/manifest.json" \
            remote-manifest.json --only-show-errors
          cmp checkpoint-package/generation-manifest.json remote-manifest.json
          aws s3 cp checkpoint-package/next-current.json \
            "s3://$S3_BUCKET/current.json" --only-show-errors

  deploy-pages:
    name: deploy-pages
    needs: run
    if: needs.run.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
