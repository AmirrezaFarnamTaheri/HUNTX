name: huntx-production

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Parallel ingestion workers (1-16)"
        required: false
        default: "2"
      msg_fresh_hours:
        description: "First-run text lookback hours"
        required: false
        default: "2"
      file_fresh_hours:
        description: "First-run media lookback hours"
        required: false
        default: "48"
      msg_subsequent_hours:
        description: "Later text lookback hours (0=all unseen)"
        required: false
        default: "0"
      file_subsequent_hours:
        description: "Later media lookback hours (0=all unseen)"
        required: false
        default: "0"
      reset:
        description: "Start a new state generation"
        required: false
        type: boolean
        default: false
      reset_confirm:
        description: "Type RESET-HUNTX-STATE exactly"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: huntx-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MAX_WORKERS: ${{ github.event.inputs.max_workers || '2' }}
  MSG_FRESH_HOURS: ${{ github.event.inputs.msg_fresh_hours || '2' }}
  FILE_FRESH_HOURS: ${{ github.event.inputs.file_fresh_hours || '48' }}
  MSG_SUBSEQUENT_HOURS: ${{ github.event.inputs.msg_subsequent_hours || '0' }}
  FILE_SUBSEQUENT_HOURS: ${{ github.event.inputs.file_subsequent_hours || '0' }}
  HUNTX_RUN_TIMEOUT: "5400"
  HUNTX_COMPLETION_BUFFER: "900"
  HUNTX_CANONICAL_RESOLVE_TIMEOUT: "20"
  HUNTX_TELEGRAM_CLEANUP_TIMEOUT: "10"
  HUNTX_SOURCE_TIMEOUT: "600"
  HUNTX_ALLOW_PARTIAL_EXPORT: "true"
  HUNTX_RUN_SUMMARY_PATH: "persist/data/logs/run-summary.json"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_PREFER_BINARY: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: production-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            pyproject.toml

      - name: Describe validation environment
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            go version
            python --version
            python -m pip --version
            git status --short
            df -h .
          } | tee validation-environment.log

      - name: Validate Go release plane
        run: |
          set -euo pipefail
          formatting="$(gofmt -l .)"
          test -z "$formatting" || {
            printf 'Unformatted Go files:\n%s\n' "$formatting"
            exit 1
          }
          go test -race ./...
          go vet ./...
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools
          go build -o .bin/huntx-engine ./cmd/huntx-engine

      - name: Install and validate Python release plane
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m compileall -q -j 0 src tests scripts
          python -m flake8 src/huntx tests scripts --count --statistics
          python -m mypy src/huntx
          python -m pytest -q -m "not perf" --strict-config --strict-markers --durations=20 --junitxml=pytest-results.xml

      - name: Summarize quality gate
        if: always()
        run: |
          {
            echo "## Production quality gate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Job status: **${{ job.status }}**"
            echo "- Go: \`$(go version 2>/dev/null || echo unavailable)\`"
            echo "- Python: \`$(python --version 2>&1 || echo unavailable)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pytest-results.xml
            validation-environment.log
          if-no-files-found: warn
          retention-days: 7

  restore:
    name: restore-verified-state
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - name: Checkout integrity verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build integrity verifier
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools

      - name: Restore GitHub-hosted state
        id: github_state
        if: env.S3_BUCKET == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-package
          key: huntx-runtime-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            huntx-runtime-state-

      - name: Require OIDC role for optional S3 backend
        if: env.S3_BUCKET != '' && env.AWS_ROLE_ARN == ''
        run: |
          echo "::error title=AWS role missing::S3_BUCKET is configured, so AWS_ROLE_ARN is required. Static AWS access keys are intentionally unsupported."
          exit 1

      - name: Configure AWS credentials
        if: env.S3_BUCKET != '' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Restore and verify immutable generation
        id: restore_state
        env:
          GITHUB_STATE_CACHE_KEY: ${{ steps.github_state.outputs.cache-matched-key }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          echo "mode=stateless" >> "$GITHUB_OUTPUT"
          mkdir -p state-input/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}
          touch state-input/.state-bundle

          if [[ -z "$S3_BUCKET" ]]; then
            if [[ -z "$GITHUB_STATE_CACHE_KEY" ]]; then
              echo "No GitHub-hosted state cache yet; starting fresh."
              echo "mode=fresh" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            for required in \
              checkpoint-package/next-current.json \
              checkpoint-package/generation-manifest.json \
              checkpoint-package/payload; do
              if [[ ! -e "$required" ]]; then
                echo "::error title=Invalid GitHub state cache::Missing $required in $GITHUB_STATE_CACHE_KEY"
                exit 1
              fi
            done
            generation="$(.bin/huntx-tools runtime-generation validate-pointer \
              --pointer checkpoint-package/next-current.json \
              --manifest checkpoint-package/generation-manifest.json)"
            .bin/huntx-tools runtime-generation verify \
              --root checkpoint-package/payload \
              --manifest checkpoint-package/generation-manifest.json
            rm -rf state-input
            cp -a checkpoint-package/payload state-input
            mkdir -p state-input/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}
            touch state-input/.state-bundle
            echo "GitHub-hosted state restored from $GITHUB_STATE_CACHE_KEY."
            echo "mode=github-cache" >> "$GITHUB_OUTPUT"
            echo "generation=$generation" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          aws sts get-caller-identity --no-cli-pager >/dev/null
          if ! aws s3api head-object --bucket "$S3_BUCKET" --key current.json --no-cli-pager >/dev/null 2>restore-error.log; then
            if ! grep -Eq 'NotFound|404|NoSuchKey' restore-error.log; then
              cat restore-error.log >&2
              echo "Unable to determine whether durable state exists; refusing a fresh run." >&2
              exit 1
            fi
            echo "No current generation; starting fresh."
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws s3 cp "s3://$S3_BUCKET/current.json" current.json --only-show-errors

          generation="$(.bin/huntx-tools runtime-generation validate-pointer --pointer current.json)"
          aws s3 cp \
            "s3://$S3_BUCKET/generations/$generation/manifest.json" \
            generation-manifest.json --only-show-errors
          .bin/huntx-tools runtime-generation validate-pointer \
            --pointer current.json \
            --manifest generation-manifest.json >/dev/null
          rm -rf state-input
          mkdir state-input
          aws s3 sync \
            "s3://$S3_BUCKET/generations/$generation/payload" \
            state-input --only-show-errors
          .bin/huntx-tools runtime-generation verify \
            --root state-input \
            --manifest generation-manifest.json
          mkdir -p state-input/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}
          touch state-input/.state-bundle
          echo "mode=restored" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Back up reset pointer and clear restored state
        if: ${{ inputs.reset == true }}
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.reset_confirm }}" != "RESET-HUNTX-STATE" ]]; then
            echo "::error title=Reset not confirmed::reset_confirm must exactly match RESET-HUNTX-STATE"
            exit 2
          fi
          if [[ -n "$S3_BUCKET" && -f current.json ]]; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_key="backups/$stamp/current.json"
            aws s3 cp current.json "s3://$S3_BUCKET/$backup_key" --only-show-errors
            aws s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "$backup_key" \
              --no-cli-pager >/dev/null
          fi
          rm -rf state-input
          mkdir -p state-input/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}
          touch state-input/.state-bundle

      - name: Describe restored state
        if: always()
        run: |
          set -euo pipefail
          echo "restore_mode=${{ steps.restore_state.outputs.mode || 'unknown' }}"
          echo "restored_generation=${{ steps.restore_state.outputs.generation || 'none' }}"
          find state-input -maxdepth 3 -type f -printf '%s\t%p\n' | sort -nr | head -200 || true
          {
            echo "## State restore"
            echo
            echo "- Mode: \`${{ steps.restore_state.outputs.mode || 'unknown' }}\`"
            echo "- Generation: \`${{ steps.restore_state.outputs.generation || 'none' }}\`"
            echo "- Reset requested: \`${{ inputs.reset || false }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload state handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-state-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: state-input/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  run:
    name: ingest-build-package
    needs: restore
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: read
    outputs:
      checkpoint_ready: ${{ steps.checkpoint.outputs.ready }}
      package_ready: ${{ steps.package.outputs.ready }}
      package_source: ${{ steps.package.outputs.source }}
      runtime_disposition: ${{ steps.diagnostics.outputs.disposition }}
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          require_uint() {
            local name="$1" value="$2" maximum="$3"
            if ! [[ "$value" =~ ^[0-9]+$ ]] || (( 10#$value > maximum )); then
              echo "::error title=Invalid input::$name must be an integer from 0 to $maximum"
              exit 2
            fi
          }
          require_uint max_workers "$MAX_WORKERS" 16
          (( 10#$MAX_WORKERS >= 1 )) || exit 2
          require_uint msg_fresh_hours "$MSG_FRESH_HOURS" 720
          require_uint file_fresh_hours "$FILE_FRESH_HOURS" 720
          require_uint msg_subsequent_hours "$MSG_SUBSEQUENT_HOURS" 720
          require_uint file_subsequent_hours "$FILE_SUBSEQUENT_HOURS" 720

      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release tools
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Download restored state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-state-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist

      - name: Snapshot last verified outputs
        run: |
          set -euo pipefail
          rm -rf safety-net
          mkdir -p safety-net/data
          for directory in outputs outputs_dev; do
            if [[ -d "persist/data/$directory" ]]; then
              cp -a "persist/data/$directory" safety-net/data/
            fi
          done
          if [[ -f persist/state.db ]]; then
            cp -a persist/state.db safety-net/state.db
          fi
          find safety-net -maxdepth 3 -type f -printf '%s\t%p\n' | sort -nr | head -200 || true

      - name: Describe runtime context
        run: |
          set -euo pipefail
          mkdir -p persist/data/logs
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "commit=$GITHUB_SHA"
            echo "max_workers=$MAX_WORKERS"
            echo "msg_fresh_hours=$MSG_FRESH_HOURS"
            echo "file_fresh_hours=$FILE_FRESH_HOURS"
            echo "msg_subsequent_hours=$MSG_SUBSEQUENT_HOURS"
            echo "file_subsequent_hours=$FILE_SUBSEQUENT_HOURS"
            echo "run_timeout=$HUNTX_RUN_TIMEOUT"
            echo "completion_buffer=$HUNTX_COMPLETION_BUFFER"
            echo "source_timeout=$HUNTX_SOURCE_TIMEOUT"
            echo "partial_export=$HUNTX_ALLOW_PARTIAL_EXPORT"
            go version
            python --version
            df -h .
            find persist -maxdepth 3 -type f -printf '%s\t%p\n' | sort -nr | head -200 || true
          } | tee persist/data/logs/runtime-context.log

      - name: Run HuntX with controlled watchdog
        id: runtime
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PUBLISH_BOT_TOKEN: ${{ secrets.PUBLISH_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          HUNTX_MAX_WORKERS: ${{ env.MAX_WORKERS }}
          LOG_LEVEL: INFO
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 105m \
            huntx \
              --config configs/config.prod.yaml \
              --data-dir persist/data \
              --db-path persist/state.db \
              run \
              --msg-fresh-hours "$MSG_FRESH_HOURS" \
              --file-fresh-hours "$FILE_FRESH_HOURS" \
              --msg-subsequent-hours "$MSG_SUBSEQUENT_HOURS" \
              --file-subsequent-hours "$FILE_SUBSEQUENT_HOURS" \
            2>&1 | tee -a persist/data/logs/runtime.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "runtime_exit_code=$rc" | tee -a persist/data/logs/runtime-context.log
          exit 0

      - name: Verify and package recoverable output
        if: always()
        id: package
        run: |
          set -u
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "source=none" >> "$GITHUB_OUTPUT"

          try_package() {
            local candidate_dir="$1"
            if ! find persist/data/outputs -type f -size +0c -print -quit 2>/dev/null | grep -q .; then
              return 1
            fi
            .bin/huntx-tools verify-output --data-dir persist/data || return 1
            # Keep the versioned dashboard shell. site-data replaces only the
            # verified artifacts and catalog within this candidate directory.
            rm -rf "$candidate_dir"
            mkdir -p "$candidate_dir"
            cp -a docs/. "$candidate_dir/"
            .bin/huntx-tools site-data --data-dir persist/data --docs-dir "$candidate_dir" || return 1
            test -f "$candidate_dir/index.html"
            test -f "$candidate_dir/assets/js/bundle.js"
            test -f "$candidate_dir/sw.js"
            rm -rf docs
            mv "$candidate_dir" docs
          }

          restore_previous_outputs() {
            rm -rf persist/data/outputs persist/data/outputs_dev
            for directory in outputs outputs_dev; do
              if [[ -d "safety-net/data/$directory" ]]; then
                cp -a "safety-net/data/$directory" persist/data/
              fi
            done
          }

          if try_package docs-candidate; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "source=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning title=Current output degraded::New output could not be verified or materialized; attempting last verified output."
          restore_previous_outputs
          if try_package docs-candidate; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "source=restored" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release safenet activated::Publishing the last verified output while preserving newly checkpointed ingestion state."
            exit 0
          fi

          rm -rf docs-candidate
          echo "::warning title=No packageable output::Neither current nor restored output could be independently verified; checkpoint and diagnostics will still persist."

      - name: Build verified checkpoint handoff
        if: always()
        id: checkpoint
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          python scripts/checkpoint_runtime_state.py \
            --db persist/state.db \
            --raw-dir persist/data/raw

          generation="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p checkpoint-package/payload/data
          cp persist/state.db checkpoint-package/payload/state.db
          for directory in raw archive outputs outputs_dev state; do
            if [[ -d "persist/data/$directory" ]]; then
              cp -a "persist/data/$directory" checkpoint-package/payload/data/
            fi
          done
          .bin/huntx-tools runtime-generation build \
            --root checkpoint-package/payload \
            --generation "$generation" \
            --manifest checkpoint-package/generation-manifest.json \
            --pointer checkpoint-package/next-current.json
          .bin/huntx-tools runtime-generation verify \
            --root checkpoint-package/payload \
            --manifest checkpoint-package/generation-manifest.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish structured runtime diagnostics
        if: always()
        id: diagnostics
        run: |
          set -euo pipefail
          python scripts/report_runtime_health.py \
            --summary "$HUNTX_RUN_SUMMARY_PATH" \
            --exit-code "${{ steps.runtime.outputs.exit_code || '1' }}" \
            --data-dir persist/data \
            --checkpoint-ready "${{ steps.checkpoint.outputs.ready || 'false' }}" \
            --package-ready "${{ steps.package.outputs.ready || 'false' }}" \
            --package-source "${{ steps.package.outputs.source || 'none' }}"

      - name: Upload checkpoint handoff
        if: steps.checkpoint.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkpoint-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload distributable output
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huntx-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist/data/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload logs and structured diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huntx-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist/data/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Pages artifact
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

      - name: Enforce only truly fatal runtime outcomes
        if: always()
        run: |
          set -euo pipefail
          checkpoint="${{ steps.checkpoint.outputs.ready || 'false' }}"
          disposition="${{ steps.diagnostics.outputs.disposition || 'fatal' }}"
          rc="${{ steps.runtime.outputs.exit_code || '1' }}"

          if [[ "$checkpoint" != "true" ]]; then
            echo "::error title=Checkpoint unavailable::Runtime state could not be validated and packaged; refusing to report success."
            exit 1
          fi
          if [[ "$disposition" == "fatal" ]]; then
            echo "::error title=Fatal runtime disposition::exit_code=$rc disposition=$disposition"
            (( rc != 0 )) || rc=1
            exit "$rc"
          fi
          if (( rc == 0 )); then
            exit 0
          fi
          if [[ "$disposition" == "degraded" ]]; then
            echo "::warning title=Degraded success::Runtime returned $rc, but structured health and a verified checkpoint show recoverable progress."
            exit 0
          fi
          case "$rc" in
            124|137|143)
              echo "::warning title=Watchdog recovery::Runtime was interrupted with code $rc after a verified checkpoint was produced."
              exit 0
              ;;
          esac

          echo "::error title=Fatal runtime outcome::exit_code=$rc disposition=$disposition"
          exit "$rc"

  persist:
    name: persist-immutable-state
    needs: run
    if: ${{ always() && needs.run.outputs.checkpoint_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - name: Checkout integrity verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build integrity verifier
        run: |
          set -euo pipefail
          mkdir -p .bin
          go build -o .bin/huntx-tools ./cmd/huntx-tools

      - name: Download checkpoint handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkpoint-package

      - name: Reverify checkpoint
        id: generation
        run: |
          set -euo pipefail
          generation="$(.bin/huntx-tools runtime-generation validate-pointer \
            --pointer checkpoint-package/next-current.json \
            --manifest checkpoint-package/generation-manifest.json)"
          .bin/huntx-tools runtime-generation verify \
            --root checkpoint-package/payload \
            --manifest checkpoint-package/generation-manifest.json
          echo "id=$generation" >> "$GITHUB_OUTPUT"

      - name: Save verified state to GitHub cache
        if: env.S3_BUCKET == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-package
          key: huntx-runtime-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require OIDC role for optional S3 backend
        if: env.S3_BUCKET != '' && env.AWS_ROLE_ARN == ''
        run: |
          echo "::error title=AWS role missing::S3_BUCKET is configured, so AWS_ROLE_ARN is required. Static AWS access keys are intentionally unsupported."
          exit 1

      - name: Configure AWS credentials
        if: env.S3_BUCKET != '' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload generation then atomically advance pointer
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          if [[ -z "$S3_BUCKET" ]]; then
            echo "Verified checkpoint persisted in GitHub cache; no external storage keys required."
            exit 0
          fi
          generation="${{ steps.generation.outputs.id }}"
          prefix="generations/$generation"
          aws sts get-caller-identity --no-cli-pager >/dev/null
          aws s3 sync checkpoint-package/payload \
            "s3://$S3_BUCKET/$prefix/payload" \
            --no-follow-symlinks --only-show-errors
          aws s3 cp checkpoint-package/generation-manifest.json \
            "s3://$S3_BUCKET/$prefix/manifest.json" --only-show-errors
          aws s3 cp "s3://$S3_BUCKET/$prefix/manifest.json" \
            remote-manifest.json --only-show-errors
          cmp checkpoint-package/generation-manifest.json remote-manifest.json
          aws s3 cp checkpoint-package/next-current.json \
            "s3://$S3_BUCKET/current.json" --only-show-errors

      - name: Summarize immutable persistence
        if: always()
        run: |
          backend="s3"
          [[ -z "$S3_BUCKET" ]] && backend="github-cache"
          {
            echo "## Immutable state persistence"
            echo
            echo "- Backend: \`$backend\`"
            echo "- Generation: \`${{ steps.generation.outputs.id || 'unavailable' }}\`"
            echo "- Runtime disposition: \`${{ needs.run.outputs.runtime_disposition || 'unknown' }}\`"
            echo "- Package source: \`${{ needs.run.outputs.package_source || 'none' }}\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: deploy-pages
    needs: [run, persist]
    if: ${{ always() && needs.run.result == 'success' && needs.persist.result == 'success' && needs.run.outputs.package_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
