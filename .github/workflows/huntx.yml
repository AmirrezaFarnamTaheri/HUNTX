name: huntx

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Parallel ingestion/transform workers"
        required: false
        default: "3"
      msg_fresh_hours:
        description: "Text lookback hours for first-seen sources"
        required: false
        default: "2"
      file_fresh_hours:
        description: "File/media lookback hours for first-seen sources"
        required: false
        default: "48"
      msg_subsequent_hours:
        description: "Text lookback on subsequent runs (0=all new since last)"
        required: false
        default: "0"
      file_subsequent_hours:
        description: "File/media lookback on subsequent runs (0=all new since last)"
        required: false
        default: "0"
      reset:
        description: "Factory reset before run (wipe all state/data/outputs)"
        required: false
        type: boolean
        default: false
      reset_confirm:
        description: "To confirm factory reset, type 'RESET-HUNTX-STATE' exactly"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: huntx-production
  cancel-in-progress: false

env:
  MAX_WORKERS: ${{ github.event.inputs.max_workers || '3' }}
  MSG_FRESH_HOURS: ${{ github.event.inputs.msg_fresh_hours || '2' }}
  FILE_FRESH_HOURS: ${{ github.event.inputs.file_fresh_hours || '48' }}
  MSG_SUBSEQUENT_HOURS: ${{ github.event.inputs.msg_subsequent_hours || '0' }}
  FILE_SUBSEQUENT_HOURS: ${{ github.event.inputs.file_subsequent_hours || '0' }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    outputs:
      restore_safe: ${{ steps.restore.outputs.safe }}
    steps:
      - name: Checkout runtime files only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            configs
            docs
            scripts
            src
            pyproject.toml
            requirements.txt

      - name: Free disk only when capacity is low
        shell: bash
        run: |
          set -euo pipefail
          available_kb="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          echo "Available disk before cleanup: $((available_kb / 1024 / 1024)) GiB"
          if (( available_kb < 20 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            docker system prune -af 2>/dev/null || true
          fi
          df -h /

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --require-hashes -r requirements.txt && \
               python -m pip install --no-deps -e .; then
              python -m pip check
              exit 0
            fi
            if (( attempt == 3 )); then
              echo "Dependency installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Fast runtime preflight
        run: python -m compileall -q -j 0 src scripts

      - name: Prepare directories
        run: mkdir -p persist/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs} docs/artifacts

      - name: Configure AWS credentials (optional OIDC)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Restore state
        id: restore
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          echo "safe=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$S3_BUCKET" ]]; then
            echo "No S3 bucket configured; running stateless."
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws s3 cp "s3://$S3_BUCKET/state.db" persist/state.db --only-show-errors \
            || echo "No prior state.db; starting fresh."
          aws s3 sync "s3://$S3_BUCKET/archive" persist/data/archive --only-show-errors
          echo "safe=true" >> "$GITHUB_OUTPUT"

      - name: Factory reset
        if: ${{ github.event.inputs.reset == 'true' && github.event.inputs.reset_confirm == 'RESET-HUNTX-STATE' }}
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          rm -rf persist/state.db persist/data/{raw,outputs,outputs_dev,archive,dist,rejects,state,logs}/*
          if [[ -n "$S3_BUCKET" ]]; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            aws s3 cp "s3://$S3_BUCKET/state.db" "s3://$S3_BUCKET/backups/$stamp/state.db" --only-show-errors || true
            aws s3 sync "s3://$S3_BUCKET/archive" "s3://$S3_BUCKET/backups/$stamp/archive" --only-show-errors || true
            aws s3 rm "s3://$S3_BUCKET/state.db" --only-show-errors || true
            aws s3 rm "s3://$S3_BUCKET/archive" --recursive --only-show-errors || true
          fi

      - name: Run HuntX
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PUBLISH_BOT_TOKEN: ${{ secrets.PUBLISH_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          HUNTX_MAX_WORKERS: ${{ env.MAX_WORKERS }}
          LOG_LEVEL: INFO
        run: |
          huntx \
            --config configs/config.prod.yaml \
            --data-dir persist/data \
            --db-path persist/state.db \
            run \
            --msg-fresh-hours "$MSG_FRESH_HOURS" \
            --file-fresh-hours "$FILE_FRESH_HOURS" \
            --msg-subsequent-hours "$MSG_SUBSEQUENT_HOURS" \
            --file-subsequent-hours "$FILE_SUBSEQUENT_HOURS"

      - name: Verify and package output
        env:
          HUNTX_DATA_DIR: persist/data
        run: |
          python scripts/verify_output.py
          python scripts/generate_site_data.py

      - name: Persist state
        if: ${{ always() && !cancelled() && steps.restore.outputs.safe == 'true' }}
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          if [[ -z "$S3_BUCKET" ]]; then
            echo "No S3 bucket configured; state remains ephemeral."
            exit 0
          fi
          test -s persist/state.db
          aws s3 cp persist/state.db "s3://$S3_BUCKET/state.db" --only-show-errors
          aws s3 sync persist/data/archive "s3://$S3_BUCKET/archive" --only-show-errors

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## HuntX production run"
            echo "- Workers: $MAX_WORKERS"
            echo "- State restore safe: ${{ steps.restore.outputs.safe }}"
            echo "- Disk usage: $(du -sh persist 2>/dev/null | cut -f1 || echo n/a)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distributable output
        if: success()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: huntx-output
          path: persist/data/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: huntx-logs
          path: persist/data/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs/

  deploy-pages:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
