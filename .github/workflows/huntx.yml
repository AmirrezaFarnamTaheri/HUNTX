name: huntx

on:
  pull_request:
    paths:
      - ".github/workflows/huntx.yml"
      - "configs/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Number of parallel ingestion workers (1-16)"
        required: false
        default: "2"
      msg_fresh_hours:
        description: "Text lookback hours for first-seen sources"
        required: false
        default: "2"
      file_fresh_hours:
        description: "File/media lookback hours for first-seen sources"
        required: false
        default: "48"
      msg_subsequent_hours:
        description: "Text lookback hours on subsequent runs (0=all new since last)"
        required: false
        default: "0"
      file_subsequent_hours:
        description: "File/media lookback hours on subsequent runs (0=all new since last)"
        required: false
        default: "0"
      reset:
        description: "Factory reset before run (wipe all state/data/outputs)"
        required: false
        type: boolean
        default: false
      reset_confirm:
        description: "To confirm factory reset, type 'RESET-HUNTX-STATE' exactly"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: huntx-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MAX_WORKERS: ${{ github.event.inputs.max_workers || '2' }}
  MSG_FRESH_HOURS: ${{ github.event.inputs.msg_fresh_hours || '2' }}
  FILE_FRESH_HOURS: ${{ github.event.inputs.file_fresh_hours || '48' }}
  MSG_SUBSEQUENT_HOURS: ${{ github.event.inputs.msg_subsequent_hours || '0' }}
  FILE_SUBSEQUENT_HOURS: ${{ github.event.inputs.file_subsequent_hours || '0' }}
  HUNTX_RUN_TIMEOUT: "5400"
  HUNTX_COMPLETION_BUFFER: "900"
  HUNTX_CANONICAL_RESOLVE_TIMEOUT: "20"
  HUNTX_TELEGRAM_CLEANUP_TIMEOUT: "10"
  HUNTX_SOURCE_TIMEOUT: "600"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_PREFER_BINARY: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: validate-build-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          require_uint() {
            local name="$1" value="$2" maximum="$3"
            if ! [[ "$value" =~ ^[0-9]+$ ]] || (( 10#$value > maximum )); then
              echo "::error title=Invalid input::$name must be an integer between 0 and $maximum; got '$value'"
              exit 2
            fi
          }
          require_uint max_workers "$MAX_WORKERS" 16
          if (( 10#$MAX_WORKERS < 1 )); then
            echo "::error title=Invalid input::max_workers must be at least 1"
            exit 2
          fi
          require_uint msg_fresh_hours "$MSG_FRESH_HOURS" 720
          require_uint file_fresh_hours "$FILE_FRESH_HOURS" 720
          require_uint msg_subsequent_hours "$MSG_SUBSEQUENT_HOURS" 720
          require_uint file_subsequent_hours "$FILE_SUBSEQUENT_HOURS" 720
          if [[ "${{ github.event.inputs.reset }}" == "true" && "${{ github.event.inputs.reset_confirm }}" != "RESET-HUNTX-STATE" ]]; then
            echo "::error title=Reset not confirmed::reset_confirm must exactly match RESET-HUNTX-STATE"
            exit 2
          fi

      - name: Checkout runtime and validation surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            configs
            docs
            scripts
            src
            tests
            pyproject.toml
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install once for validation and runtime
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --require-hashes --prefer-binary -r requirements.txt \
              && python -m pip install --prefer-binary flake8 mypy pytest types-requests types-PyYAML \
              && python -m pip install --no-deps -e . \
              && python -m pip check; then
              exit 0
            fi
            if (( attempt == 3 )); then
              echo "Dependency installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Compile
        run: python -m compileall -q -j 0 src tests scripts

      - name: Lint
        run: python -m flake8 src/huntx tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check
        run: python -m mypy src/huntx

      - name: Test
        run: python -m pytest -q --strict-config --strict-markers --durations=20 --junitxml=pytest-results.xml

      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare runtime directories
        if: github.event_name != 'pull_request'
        run: mkdir -p persist/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs} docs/artifacts

      - name: Configure AWS credentials (optional OIDC)
        if: ${{ github.event_name != 'pull_request' && env.AWS_ROLE_ARN != '' }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Restore durable runtime state
        if: github.event_name != 'pull_request'
        id: restore
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          echo "safe=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$S3_BUCKET" ]]; then
            echo "No S3 bucket configured; running stateless."
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          aws sts get-caller-identity --no-cli-pager >/dev/null
          if aws s3 cp "s3://$S3_BUCKET/state.db" persist/state.db --only-show-errors; then
            python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("persist/state.db")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("restored state.db is empty")
          with sqlite3.connect(path) as conn:
              result = conn.execute("PRAGMA quick_check").fetchone()
          if not result or result[0] != "ok":
              raise SystemExit(f"restored state.db failed quick_check: {result}")
          PY
          else
            echo "No prior state.db; starting fresh."
            rm -f persist/state.db
          fi

          aws s3 sync "s3://$S3_BUCKET/raw" persist/data/raw --size-only --only-show-errors
          aws s3 sync "s3://$S3_BUCKET/archive" persist/data/archive --size-only --only-show-errors
          aws s3 sync "s3://$S3_BUCKET/outputs" persist/data/outputs --size-only --only-show-errors
          aws s3 sync "s3://$S3_BUCKET/outputs_dev" persist/data/outputs_dev --size-only --only-show-errors
          echo "safe=true" >> "$GITHUB_OUTPUT"

      - name: Factory reset
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.reset == 'true' }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          rm -rf persist/state.db persist/data/{raw,outputs,outputs_dev,archive,dist,rejects,state,logs}/*
          if [[ -n "$S3_BUCKET" ]]; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            aws s3 cp "s3://$S3_BUCKET/state.db" "s3://$S3_BUCKET/backups/$stamp/state.db" --only-show-errors || true
            for prefix in raw archive outputs outputs_dev; do
              aws s3 sync "s3://$S3_BUCKET/$prefix" "s3://$S3_BUCKET/backups/$stamp/$prefix" --only-show-errors || true
              aws s3 rm "s3://$S3_BUCKET/$prefix" --recursive --only-show-errors || true
            done
            aws s3 rm "s3://$S3_BUCKET/state.db" --only-show-errors || true
          fi

      - name: Run huntx with controlled watchdog
        if: github.event_name != 'pull_request'
        id: runtime
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PUBLISH_BOT_TOKEN: ${{ secrets.PUBLISH_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          HUNTX_MAX_WORKERS: ${{ env.MAX_WORKERS }}
          LOG_LEVEL: INFO
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 105m \
            huntx \
              --config configs/config.prod.yaml \
              --data-dir persist/data \
              --db-path persist/state.db \
              run \
              --msg-fresh-hours "$MSG_FRESH_HOURS" \
              --file-fresh-hours "$FILE_FRESH_HOURS" \
              --msg-subsequent-hours "$MSG_SUBSEQUENT_HOURS" \
              --file-subsequent-hours "$FILE_SUBSEQUENT_HOURS"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if (( rc == 124 || rc == 137 )); then
            echo "::warning title=Runtime watchdog::HuntX exceeded the controlled watchdog; durable checkpoint will still run"
          elif (( rc != 0 )); then
            echo "::error title=HuntX runtime failed::exit code $rc; durable checkpoint will run before the job fails"
          fi
          exit 0

      - name: Verify and package output
        if: ${{ github.event_name != 'pull_request' && steps.runtime.outputs.exit_code == '0' }}
        env:
          HUNTX_DATA_DIR: persist/data
        run: |
          python scripts/verify_output.py
          python scripts/generate_site_data.py

      - name: Checkpoint and persist durable state
        if: ${{ always() && github.event_name != 'pull_request' && steps.restore.outputs.safe == 'true' }}
        id: checkpoint
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          test -s persist/state.db
          python scripts/checkpoint_runtime_state.py \
            --db persist/state.db \
            --raw-dir persist/data/raw

          if [[ -z "$S3_BUCKET" ]]; then
            echo "No S3 bucket configured; validated state remains ephemeral."
            exit 0
          fi

          # Raw content-addressed blobs must exist remotely before the database
          # that references them is published. Do not use --delete here: remote
          # blobs may still be referenced by older recoverable checkpoints.
          aws s3 sync persist/data/raw "s3://$S3_BUCKET/raw" --size-only --only-show-errors
          aws s3 sync persist/data/archive "s3://$S3_BUCKET/archive" --size-only --delete --only-show-errors
          aws s3 sync persist/data/outputs "s3://$S3_BUCKET/outputs" --size-only --delete --only-show-errors
          aws s3 sync persist/data/outputs_dev "s3://$S3_BUCKET/outputs_dev" --size-only --delete --only-show-errors

          next_key="state.db.next-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp persist/state.db "s3://$S3_BUCKET/$next_key" --only-show-errors
          aws s3 cp "s3://$S3_BUCKET/$next_key" "s3://$S3_BUCKET/state.db" --only-show-errors
          aws s3 rm "s3://$S3_BUCKET/$next_key" --only-show-errors

      - name: Enforce runtime result after checkpoint
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          rc="${{ steps.runtime.outputs.exit_code || '1' }}"
          if [[ "${{ steps.restore.outputs.safe || 'false' }}" != "true" ]]; then
            echo "Durable restore was not safe" >&2
            exit 1
          fi
          if [[ "${{ steps.checkpoint.outcome || 'skipped' }}" != "success" ]]; then
            echo "Durable checkpoint did not succeed" >&2
            exit 1
          fi
          if (( rc != 0 )); then
            echo "HuntX runtime failed with exit code $rc after state was checkpointed" >&2
            exit "$rc"
          fi

      - name: Upload distributable output
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huntx-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist/data/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload logs
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huntx-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist/data/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish workflow summary
        if: always()
        run: |
          {
            echo "### HuntX workflow"
            echo "- Result: **${{ job.status }}**"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Workers: \`$MAX_WORKERS\`"
            echo "- Application budget: \`$HUNTX_RUN_TIMEOUT seconds\`"
            echo "- Runtime exit: \`${{ steps.runtime.outputs.exit_code || 'validation-only' }}\`"
            echo "- State restore safe: \`${{ steps.restore.outputs.safe || 'not-run' }}\`"
            echo "- Checkpoint outcome: \`${{ steps.checkpoint.outcome || 'not-run' }}\`"
            echo "- Disk remaining: \`$(df -h / | awk 'NR==2 {print $4}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  deploy-pages:
    needs: build
    if: ${{ needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
