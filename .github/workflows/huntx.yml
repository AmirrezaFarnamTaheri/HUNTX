name: huntx

on:
  pull_request:
    paths:
      - ".github/workflows/huntx.yml"
      - "configs/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Number of parallel ingestion workers (1-16)"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  build:
    name: validate-build-publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runtime and validation surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            configs
            docs
            scripts
            src
            tests
            pyproject.toml
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install once for validation and runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary flake8 mypy pytest pytest-asyncio types-requests types-PyYAML
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Compile
        run: python -m compileall -q -j 0 src tests scripts

      - name: Lint
        run: python -m flake8 src/huntx tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check
        run: python -m mypy src/huntx

      - name: Test
        run: python -m pytest -q --strict-config --strict-markers --durations=20 --junitxml=pytest-results.xml
