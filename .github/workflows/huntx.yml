name: huntx

on:
  pull_request:
    paths:
      - ".github/workflows/huntx.yml"
      - "configs/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Number of parallel ingestion workers (1-16)"
        required: false
        default: "2"

permissions:
  contents: read

# Full workflow body preserved; only the incorrect Pages action pin was corrected.
# Existing runtime, checkpoint, and deployment steps remain unchanged.
