name: huntx

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Number of parallel ingestion workers"
        required: false
        default: "2"
      msg_fresh_hours:
        description: "Text lookback hours for first-seen sources"
        required: false
        default: "2"
      file_fresh_hours:
        description: "File/media lookback hours for first-seen sources"
        required: false
        default: "48"
      msg_subsequent_hours:
        description: "Text lookback hours on subsequent runs (0=all new since last)"
        required: false
        default: "0"
      file_subsequent_hours:
        description: "File/media lookback hours on subsequent runs (0=all new since last)"
        required: false
        default: "0"
      reset:
        description: "Factory reset before run (wipe all state/data/outputs)"
        required: false
        type: boolean
        default: false
      reset_confirm:
        description: "To confirm factory reset, type 'RESET-HUNTX-STATE' exactly"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: huntx
  cancel-in-progress: false

env:
  MAX_WORKERS: ${{ github.event.inputs.max_workers || '2' }}
  MSG_FRESH_HOURS: ${{ github.event.inputs.msg_fresh_hours || '2' }}
  FILE_FRESH_HOURS: ${{ github.event.inputs.file_fresh_hours || '48' }}
  MSG_SUBSEQUENT_HOURS: ${{ github.event.inputs.msg_subsequent_hours || '0' }}
  FILE_SUBSEQUENT_HOURS: ${{ github.event.inputs.file_subsequent_hours || '0' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install flake8 mypy pytest types-requests types-PyYAML
          pip install --no-deps -e .
      - name: Lint (flake8)
        run: flake8 src/huntx --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Type Check (mypy)
        run: mypy src/huntx
      - name: Test (pytest)
        run: pytest tests/

  run:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Retry pip install to handle transient network issues
          n=0
          until [ "$n" -ge 3 ]; do
            pip install --require-hashes -r requirements.txt && pip install --no-deps -e . && break
            n=$((n+1))
            echo "Install failed. Retrying in $((n*5)) seconds..."
            sleep $((n*5))
          done

      - name: Prepare directories
        run: mkdir -p persist/data/{raw,outputs,outputs_dev,dist,rejects,archive,state,logs}

      - name: Configure AWS credentials (optional OIDC)
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Restore state
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          if [[ -n "$S3_BUCKET" ]]; then
            echo "Restoring state from S3 bucket: $S3_BUCKET"
            aws --version
            aws s3 cp s3://$S3_BUCKET/state.db persist/state.db || echo "No state.db found in S3, starting fresh."
            # Critical: Do not suppress errors here. If sync fails, we must abort to prevent wiping S3 in the persist step.
            aws s3 sync s3://$S3_BUCKET/archive persist/data/archive --quiet
          else
            echo "No S3_BUCKET secret defined. Starting fresh (stateless run)."
          fi

      - name: Factory reset (if requested)
        if: ${{ github.event.inputs.reset == 'true' && github.event.inputs.reset_confirm == 'RESET-HUNTX-STATE' }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          echo "=== FACTORY RESET ==="
          rm -rf persist/state.db persist/data/{raw,output,archive,dist,rejects,artifacts,state,logs}/*
          rm -rf outputs/* outputs_dev/*

          # Wipe S3 state after backup
          if [[ -n "$S3_BUCKET" ]]; then
            echo "Creating backup of state.db in S3..."
            aws s3 cp s3://$S3_BUCKET/state.db s3://$S3_BUCKET/state.db.bak || true
            aws s3 rm s3://$S3_BUCKET/state.db || true
            aws s3 rm s3://$S3_BUCKET/archive --recursive || true
            echo "Wiped S3 state"
          fi

          # Recreate READMEs
          mkdir -p outputs outputs_dev
          echo -e "# HuntX Outputs\n\nAuto-generated build output. Do not edit manually." > outputs/README.md
          echo -e "# Dev Outputs\n\nAuto-generated with 48h rolling window. Do not edit manually." > outputs_dev/README.md

          echo "Reset complete — all sources will be first-seen on this run."

      - name: Print Configuration
        run: |
          echo "=== Active Configuration ==="
          echo "Max Workers: $MAX_WORKERS"
          echo "Fresh Hours (Msg/File): $MSG_FRESH_HOURS / $FILE_FRESH_HOURS"
          echo "Subsequent Hours: $MSG_SUBSEQUENT_HOURS / $FILE_SUBSEQUENT_HOURS"
          echo "S3 Bucket: ${S3_BUCKET:-'Not Configured'}"
          echo "============================"

      - name: Run huntx
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PUBLISH_BOT_TOKEN: ${{ secrets.PUBLISH_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          HUNTX_MAX_WORKERS: ${{ env.MAX_WORKERS }}
          LOG_LEVEL: INFO
        run: |
          huntx \
            --config configs/config.prod.yaml \
            --data-dir persist/data \
            --db-path persist/state.db \
            run \
            --msg-fresh-hours ${{ env.MSG_FRESH_HOURS }} \
            --file-fresh-hours ${{ env.FILE_FRESH_HOURS }} \
            --msg-subsequent-hours ${{ env.MSG_SUBSEQUENT_HOURS }} \
            --file-subsequent-hours ${{ env.FILE_SUBSEQUENT_HOURS }}

      - name: Verify & package output
        env:
          HUNTX_DATA_DIR: persist/data
        run: python scripts/verify_output.py

      - name: Generate docs site data
        env:
          HUNTX_DATA_DIR: persist/data
        run: python scripts/generate_site_data.py

      - name: Upload output
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: huntx-output
          path: persist/data/dist/
          retention-days: 4

      - name: Upload logs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: huntx-logs
          path: persist/data/logs/
          retention-days: 4

      - name: Commit outputs to main
        run: |
          git config user.name "huntx-bot"
          git config user.email "huntx-bot@users.noreply.github.com"

          # Sync output directories to the repo root before commit
          rm -rf outputs/* outputs_dev/*
          mkdir -p outputs outputs_dev
          cp -r persist/data/outputs/* outputs/ 2>/dev/null || true
          cp -r persist/data/outputs_dev/* outputs_dev/ 2>/dev/null || true

          git add outputs/ outputs_dev/ docs/catalog.json docs/artifacts/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No output changes."
          else
            git commit -m "Update outputs [skip ci]"
            
            # Retry logic for outputs push
            n=0
            until [ "$n" -ge 5 ]; do
               git push origin HEAD && break
               n=$((n+1))
               echo "Push failed. Retrying in $((n*5)) seconds..."
               sleep $((n*5))
               git pull --rebase || true
            done
          fi

      - name: Persist state
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          if [[ -n "$S3_BUCKET" ]]; then
            echo "Persisting state to S3 bucket: $S3_BUCKET"
            aws --version
            # Upload database
            aws s3 cp persist/state.db s3://$S3_BUCKET/state.db
            # Sync archive (upload-only; never delete remote history)
            aws s3 sync persist/data/archive s3://$S3_BUCKET/archive --quiet
          else
            echo "No S3_BUCKET secret defined. State not persisted."
          fi

      - name: Generate site data
        run: python scripts/generate_site_data.py

      - name: Setup Pages
        uses: actions/configure-pages@983d626a19e051b50721d2ad484c2877b1f72621 # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda996908d67 # v3.0.1
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164db5ed86f2b6a764531401a52557ae23 # v4.0.5
