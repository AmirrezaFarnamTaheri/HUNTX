# Trigger the one-time PR review remediation workflow.
name: pr82-final-review-fixup

on:
  push:
    branches:
      - "codex/huntx-remediation-followup"
    paths:
      - ".github/workflows/pr82-final-review-fixup.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/huntx-remediation-followup
          fetch-depth: 1

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          i18n_path = Path("docs/assets/js/i18n.js")
          text = i18n_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '    this.textSources = new WeakMap();\n    this.attributeSources = new WeakMap();',
              '    this.textSources = new WeakMap();\n    this.lastWrittenText = new WeakMap();\n    this.attributeSources = new WeakMap();\n    this.lastWrittenAttributes = new WeakMap();',
              "i18n constructor",
          )
          text = replace_once(
              text,
              '    const translated = this.translate(content);\n    node.nodeValue = source.replace(content, translated);',
              '    const translated = this.translate(content);\n    const output = source.replace(content, translated);\n    if (node.nodeValue !== output) {\n      const pending = this.lastWrittenText.get(node);\n      this.lastWrittenText.set(node, { value: output, count: (pending?.count || 0) + 1 });\n      node.nodeValue = output;\n    }',
              "i18n text write tracking",
          )
          text = replace_once(
              text,
              '      if (sources.has(name)) element.setAttribute(name, this.translate(sources.get(name)));',
              '      if (sources.has(name)) {\n        const output = this.translate(sources.get(name));\n        if (element.getAttribute(name) !== output) {\n          let writes = this.lastWrittenAttributes.get(element);\n          if (!writes) {\n            writes = new Map();\n            this.lastWrittenAttributes.set(element, writes);\n          }\n          const pending = writes.get(name);\n          writes.set(name, { value: output, count: (pending?.count || 0) + 1 });\n          element.setAttribute(name, output);\n        }\n      }',
              "i18n attribute write tracking",
          )
          text = replace_once(
              text,
              '        if (mutation.type === "characterData") {\n          this.textSources.set(mutation.target, mutation.target.nodeValue || "");\n          this.isTranslating = true;\n          try { this.translateTextNode(mutation.target); } finally { this.isTranslating = false; }\n          continue;\n        }',
              '        if (mutation.type === "characterData") {\n          const currentValue = mutation.target.nodeValue || "";\n          const pending = this.lastWrittenText.get(mutation.target);\n          if (pending?.value === currentValue && pending.count > 0) {\n            if (pending.count === 1) this.lastWrittenText.delete(mutation.target);\n            else pending.count -= 1;\n            continue;\n          }\n          this.textSources.set(mutation.target, currentValue);\n          this.isTranslating = true;\n          try { this.translateTextNode(mutation.target); } finally { this.isTranslating = false; }\n          continue;\n        }',
              "i18n characterData observer",
          )
          text = replace_once(
              text,
              '        if (mutation.type === "attributes") {\n          const sources = this.attributeSources.get(mutation.target);\n          if (sources) sources.delete(mutation.attributeName);\n          this.isTranslating = true;\n          try { this.translateAttributes(mutation.target); } finally { this.isTranslating = false; }\n          continue;\n        }',
              '        if (mutation.type === "attributes") {\n          const attributeName = mutation.attributeName;\n          const currentValue = mutation.target.getAttribute(attributeName);\n          const writes = this.lastWrittenAttributes.get(mutation.target);\n          const pending = writes?.get(attributeName);\n          if (pending?.value === currentValue && pending.count > 0) {\n            if (pending.count === 1) writes.delete(attributeName);\n            else pending.count -= 1;\n            if (writes.size === 0) this.lastWrittenAttributes.delete(mutation.target);\n            continue;\n          }\n          const sources = this.attributeSources.get(mutation.target);\n          if (sources) sources.delete(attributeName);\n          this.isTranslating = true;\n          try { this.translateAttributes(mutation.target); } finally { this.isTranslating = false; }\n          continue;\n        }',
              "i18n attribute observer",
          )
          i18n_path.write_text(text, encoding="utf-8")

          sitegen_path = Path("internal/sitegen/sitegen.go")
          text = sitegen_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '\tif err := runtimegen.WriteBytesAtomic(catalogStage, append(payload, \'\\n\'), 0o600); err != nil {\n\t\treturn Catalog{}, err\n\t}\n\n\ttarget := filepath.Join(docsDir, "artifacts")',
              '\tif err := runtimegen.WriteBytesAtomic(catalogStage, append(payload, \'\\n\'), 0o600); err != nil {\n\t\treturn Catalog{}, err\n\t}\n\tdefer os.Remove(catalogStage)\n\n\ttarget := filepath.Join(docsDir, "artifacts")',
              "catalog stage cleanup",
          )
          text = replace_once(
              text,
              '\t\thadOldCatalog = true\n\t} else if !os.IsNotExist(err) {\n\t\treturn Catalog{}, err\n\t}\n\tif err := os.Rename(catalogStage, catalogTarget); err != nil {',
              '\t\thadOldCatalog = true\n\t} else if !os.IsNotExist(err) {\n\t\t_ = os.RemoveAll(target)\n\t\tif hadOld {\n\t\t\t_ = os.Rename(backup, target)\n\t\t}\n\t\treturn Catalog{}, err\n\t}\n\tif err := os.Rename(catalogStage, catalogTarget); err != nil {',
              "catalog stat rollback",
          )
          sitegen_path.write_text(text, encoding="utf-8")

          generator_path = Path("scripts/update_frontend.py")
          text = generator_path.read_text(encoding="utf-8")
          old_toast = '  <div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2 pointer-events-none"></div>'
          new_toast = '  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2 pointer-events-none"></div>'
          text = replace_once(text, old_toast, new_toast, "toast generator markup")
          generator_path.write_text(text, encoding="utf-8")

          index_path = Path("docs/index.html")
          index = index_path.read_text(encoding="utf-8")
          if new_toast not in index:
              if old_toast not in index:
                  raise SystemExit("toast checked-in markup does not match expected old or new form")
              index_path.write_text(index.replace(old_toast, new_toast, 1), encoding="utf-8")
          PY

          python3 - <<'PY'
          import scripts.update_frontend as frontend
          frontend.bundle()
          PY

      - name: Validate fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_frontend.py --check
          go test ./internal/sitegen
          node --check docs/assets/js/i18n.js
          node --check docs/assets/js/bundle.js
          git diff --check

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/js/i18n.js docs/assets/js/bundle.js internal/sitegen/sitegen.go scripts/update_frontend.py docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: close remaining PR review findings"
          git push origin HEAD:codex/huntx-remediation-followup
