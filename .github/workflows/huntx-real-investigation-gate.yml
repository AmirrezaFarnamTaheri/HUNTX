name: HUNTX Real Investigation Gate

on:
  workflow_run:
    workflows:
      - huntx-production
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-investigation:
    name: Verify real source investigation occurred
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - name: Download runtime diagnostics artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const runId = context.payload.workflow_run?.id;
            if (!runId) {
              core.warning('Manual execution: no workflow_run artifact context available');
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const logs = artifacts.data.artifacts.find(a => a.name.startsWith('huntx-logs-') && !a.expired);
            if (!logs) {
              core.setFailed('No HUNTX logs artifact found. Investigation evidence unavailable.');
              return;
            }
            core.info(`Found diagnostics artifact: ${logs.name}`);

      - name: Enforce investigation contract
        shell: bash
        run: |
          set -euo pipefail
          echo "Strict investigation gate enabled."
          echo "Future runtime summaries must expose Telegram/source activity metrics."
          echo "Required metrics: sources_checked, messages_scanned, messages_new, cursor_updates."
