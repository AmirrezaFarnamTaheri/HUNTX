name: Temporary HTTP feed Go formatting

on:
  push:
    branches:
      - feat/http-subscription-investigation-20261012
    paths:
      - ".github/workflows/http-feed-gofmt-once.yml"

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format new Go source
        run: |
          set -euo pipefail
          gofmt -w cmd/huntx-engine/subfeed/fetch.go
          gofmt -w cmd/huntx-engine/subfeed/fetch_test.go
          gofmt -w cmd/huntx-engine/main.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cmd/huntx-engine/subfeed/fetch.go cmd/huntx-engine/subfeed/fetch_test.go cmd/huntx-engine/main.go
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(go): format public feed Go transport"
            git push origin HEAD:refs/heads/feat/http-subscription-investigation-20261012
          fi
