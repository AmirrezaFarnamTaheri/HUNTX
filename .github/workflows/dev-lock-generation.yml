name: dev-lock-generation

on:
  pull_request:
    paths:
      - "requirements-dev.in"
      - ".github/workflows/dev-lock-generation.yml"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - fix/huntx-synthesis-hardening-20260712
    paths:
      - "requirements-dev.in"
      - ".github/workflows/dev-lock-generation.yml"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"
      - name: Generate hashed development lock and diagnostics
        run: |
          set +e
          python -m pip install --disable-pip-version-check pip-tools > pip-tools-install.txt 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            pip-compile --generate-hashes --allow-unsafe --resolver=backtracking --output-file=requirements-dev.txt requirements-dev.in > lock-generation.txt 2>&1
            echo "$?" > lock-status.txt
          else
            echo "$install_status" > lock-status.txt
            printf '%s\n' 'pip-tools installation failed' > lock-generation.txt
          fi
          cat pip-tools-install.txt
          cat lock-generation.txt
          exit 0
      - name: Capture type diagnostics
        run: |
          set +e
          if [ -s requirements-dev.txt ]; then
            pip install --require-hashes -r requirements-dev.txt > dev-install.txt 2>&1
          else
            pip install --require-hashes -r requirements.txt > dev-install.txt 2>&1
            pip install mypy types-requests types-PyYAML >> dev-install.txt 2>&1
          fi
          pip install --no-deps -e . >> dev-install.txt 2>&1
          mypy src/huntx --show-error-codes --no-pretty > mypy.txt 2>&1
          echo "$?" > mypy-status.txt
          cat dev-install.txt
          cat mypy.txt
          exit 0
      - name: Upload generated lock, diagnostics, and source snapshot
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: huntx-dev-lock-and-source
          path: |
            requirements-dev.txt
            pip-tools-install.txt
            lock-generation.txt
            lock-status.txt
            dev-install.txt
            mypy.txt
            mypy-status.txt
            .github/
            configs/
            docs/
            scripts/
            src/
            tests/
            pyproject.toml
            requirements.txt
            requirements-dev.in
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
