name: HUNTX Recovery Validation Launcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/huntx-recovery-validation.yml"

permissions:
  actions: write
  contents: read

jobs:
  launch:
    name: launch-recovery-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch recovery orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/huntx-recovery-orchestrator.yml/dispatches" \
            -f ref=main
          echo "HUNTX Recovery Orchestrator dispatched for end-to-end validation."
