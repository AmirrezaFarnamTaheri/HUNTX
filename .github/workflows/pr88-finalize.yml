name: pr88-finalize

on:
  push:
    branches:
      - fix/mobile-touch-target-hardening
    paths:
      - .github/workflows/pr88-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mobile-touch-target-hardening
          fetch-depth: 1
      - name: Remove obsolete generator import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/update_frontend.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import os\n", "", 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q scripts/update_frontend.py
          if git diff --quiet -- scripts/update_frontend.py; then
            echo "No generator cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_frontend.py
          git commit -m "chore(frontend): remove obsolete generator import"
          git push origin HEAD:fix/mobile-touch-target-hardening
