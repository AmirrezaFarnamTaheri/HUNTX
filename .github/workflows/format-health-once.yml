name: Format health Go files (one-time)

on:
  push:
    branches:
      - refactor/proxy-health-history-go-20261012
    paths:
      - ".github/workflows/format-health-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format Go source
        run: |
          set -euo pipefail
          gofmt -w cmd/huntx-engine/internal/score/health_score.go
          gofmt -w cmd/huntx-engine/internal/score/health_score_test.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cmd/huntx-engine/internal/score/health_score.go cmd/huntx-engine/internal/score/health_score_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(go): format native health evidence scoring"
            git push origin HEAD:refs/heads/refactor/proxy-health-history-go-20261012
          fi
