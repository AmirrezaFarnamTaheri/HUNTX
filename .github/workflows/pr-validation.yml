name: pull-request-validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - "fix/**"
      - "agent/**"
    paths:
      - ".github/work