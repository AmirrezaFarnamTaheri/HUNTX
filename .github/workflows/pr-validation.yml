name: pull-request-validation

on:
  pull_request:
    paths:
      - ".github/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements*.in"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  merge_group:
  push:
    branches:
      - "fix/**"
      - "agent/**"
    paths:
      - ".github/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements*.in"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout only validation inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            configs
            scripts
            src
            tests
            pyproject.toml
            requirements.txt
            requirements-dev.in

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.in

      - name: Install locked runtime and bounded validation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install \
            'flake8>=7,<8' \
            'mypy>=1.10,<2' \
            'pytest>=8,<9' \
            'types-requests>=2.31' \
            'types-PyYAML>=6'
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Compile
        run: python -m compileall -q -j 0 src tests

      - name: Lint fatal errors
        run: python -m flake8 src/huntx tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check
        run: python -m mypy src/huntx

      - name: Test
        run: python -m pytest -q tests --durations=20 --junitxml=pytest-results.xml

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 3
