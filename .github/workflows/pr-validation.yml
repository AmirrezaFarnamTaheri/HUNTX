name: pull-request-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "docs/**"
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - "fix/**"
      - "agent/**"
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "docs/**"
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23"
          cache: true

      - name: Go quality gate
        run: |
          set -euo pipefail
          gofmt -w -l .
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          go build ./cmd/huntx-tools

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Python quality gate
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary flake8 mypy pytest pytest-asyncio types-requests types-PyYAML
          python -m pip install --no-deps -e .
          python -m pip check
          python -m compileall -q -j 0 src tests scripts
          python -m flake8 src/huntx tests scripts --count --statistics
          python -m mypy src/huntx
          python -m pytest -q --strict-config --strict-markers --durations=20 --junitxml=pytest-results.xml
