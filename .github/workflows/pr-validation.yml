name: pull-request-validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - "fix/**"
      - "agent/**"
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout only validation inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            configs
            scripts
            src
            tests
            pyproject.toml
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install flake8 mypy pytest types-requests types-PyYAML
          python -m pip install --no-deps -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: python -m flake8 src/huntx tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check
        run: python -m mypy src/huntx

      - name: Test
        run: python -m pytest -q tests/ --durations=20 --junitxml=pytest-results.xml

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo "### Validation"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Python: 3.12"
            echo "- Slowest test durations are included in the job log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pytest-results-${{ github.run_attempt }}
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 7
