name: pull-request-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - "fix/**"
      - "agent/**"
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_PREFER_BINARY: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout validation surface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            configs
            scripts
            src
            tests
            pyproject.toml
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary flake8 mypy pytest types-requests types-PyYAML
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Compile
        run: python -m compileall -q -j 0 src tests

      - name: Lint
        run: python -m flake8 src/huntx tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check
        run: |
          set -o pipefail
          python -m mypy src/huntx 2>&1 | tee mypy-results.txt

      - name: Test
        run: python -m pytest -q --strict-config --strict-markers --durations=20 --junitxml=pytest-results.xml

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo "### Validation"
            echo "- Result: **${{ job.status }}**"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Python: 3.12"
            echo "- Concurrency key: \`${{ github.head_ref || github.ref_name }}\`"
            echo "- Slowest test durations are included in the job log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: validation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mypy-results.txt
            pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7
