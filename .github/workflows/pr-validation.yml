name: pull-request-validation

on:
  workflow_dispatch:
  # One daily validation run supersedes the former daily go-security and
  # weekly dev-output-refresh workflows; PRs/pushes share the same gates.
  schedule:
    - cron: "23 5 * * *"
  pull_request:
    paths:
      - ".github/**"
      - "outputs/**"
      - "outputs_dev/**"
      - "configs/**"
      - "docs/**"
      - "eslint.config.mjs"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "tailwind.config.cjs"
      - "deploy/**"
      - "cmd/**"
      - "internal/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  # Direct main updates remain validated. PR branches use the pull_request
  # trigger, avoiding duplicate full validation runs for the same commit.
  # Unopened branches can be checked via workflow_dispatch.
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "outputs/**"
      - "outputs_dev/**"
      - "configs/**"
      - "docs/**"
      - "eslint.config.mjs"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "tailwind.config.cjs"
      - "deploy/**"
      - "cmd/**"
      - "internal/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"

concurrency:
  group: pull-request-validation-${{ github.event_name == 'schedule' && 'scheduled' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The gate is split into independent jobs so a failure in one language is
# reported in minutes instead of after every slower stage has finished, and so
# the slow stages (Docker/Helm, Playwright) run in parallel with the fast ones.
#
# `quality-gate` at the bottom keeps the check name that branch protection
# already requires: it succeeds only when every job below succeeded, so
# splitting the work does not weaken the merge requirement.
jobs:
  workflows:
    name: workflow-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate workflow YAML syntax
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.{yml,yaml}"].sort
            abort "No workflow files found" if paths.empty?
            paths.each { |path| YAML.load_file(path) }
          '

  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go quality and vulnerability gate
        run: |
          set -euo pipefail
          formatting="$(gofmt -l .)"
          test -z "$formatting" || {
            printf 'Unformatted Go files:\n%s\n' "$formatting"
            exit 1
          }
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go build ./cmd/huntx-tools
          go build ./cmd/huntx-engine
          go build ./cmd/huntx-daemon
          go build ./cmd/huntx-probe
          (
            cd src/huntx/connectors/v2ray_collector
            go test -race ./...
            go vet ./...
            go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          )

  deploy-manifests:
    name: deploy-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate fleet deployment manifests
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile.daemon .
          docker build -f deploy/Dockerfile.probe .
          curl -fsSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz -o helm.tar.gz
          echo "ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz
          helm_args=(
            --set-string daemon.controlToken=ci-control-token
            --set-file daemon.nodesJson=deploy/helm/huntx-fleet/ci-nodes.json
            --set-string orchestratorBearerToken=ci-orchestrator-token
            --set-string orchestratorUrl=https://receiver.invalid/api/vantage/report
            --set-string daemon.image.tag=ci
            --set-string image.tag=ci
          )
          ./linux-amd64/helm lint deploy/helm/huntx-fleet "${helm_args[@]}"
          ./linux-amd64/helm template huntx deploy/helm/huntx-fleet "${helm_args[@]}" >/dev/null

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # update_frontend.py only needs the standard library.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint and unit tests
        run: |
          set -euo pipefail
          npm run lint
          npm run test:unit

      - name: Production asset gate
        run: |
          set -euo pipefail
          npm run build:css
          git diff --exit-code -- docs/assets/css/tailwind.css
          python scripts/update_frontend.py --check

      - name: Browser tests (accessibility, rendering, deploy version skew)
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload UI review captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: huntx-control-room-visual-review
          path: test-results/ui-review/
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            pyproject.toml

      - name: Python quality gate
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m compileall -q -j 0 src tests scripts
          python -m flake8 src/huntx tests scripts --count --statistics
          python -m mypy src/huntx
          python -m pytest -q -m "not perf" --strict-config --strict-markers --durations=20 --junitxml=pytest-results.xml

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The scanners are tools, not shipped code, so they are installed
      # separately from the hash-pinned runtime requirements. The audit reads
      # the pinned file directly and never installs the project.
      - name: Audit Python and npm dependencies for known vulnerabilities
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps --disable-pip --strict
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

  # Previously a separate weekly workflow. This independent job performs the
  # scratch regeneration and telemetry/parity contract checks in the same run.
  dev-outputs:
    name: regenerate-and-verify-dev-outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Regenerate dashboard data from committed dev fixtures
        run: |
          # Regenerate into a scratch docs root so the committed artifacts are
          # never touched by this check; it must be read-only on main.
          python - <<'PY'
          import importlib.util, pathlib, tempfile
          from scripts.stage_dev_refresh_fixture import stage_legacy_release_fixture
          spec = importlib.util.spec_from_file_location(
              "site", "scripts/generate_site_data.py"
          )
          site = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(site)
          root = pathlib.Path(tempfile.mkdtemp(prefix="huntx-dev-refresh-"))
          scratch = root / "docs"
          scratch.mkdir()
          # The committed October fixture predates the release's semantic
          # deduplication contract. Normalize ONLY the scratch copy; the
          # production publish gate still rejects duplicate identities.
          staged_release = root / "release-input"
          report = stage_legacy_release_fixture(pathlib.Path("outputs"), staged_release)
          site.OUTPUTS_DIR = staged_release
          site.DOCS_DIR = scratch
          site.ARTIFACTS_DIR = scratch / "artifacts"
          site.CATALOG_FILE = scratch / "catalog.json"
          site.DATA_JS_FILE = scratch / "assets" / "js" / "data.js"
          site.generate_all()
          # Counts are sanitized and cannot disclose proxy credentials.
          print("legacy fixture normalization:", report)
          # Hand the scratch root to the verification step by path, not by
          # guessing which /tmp directory was newest.
          pathlib.Path("scratch-root.txt").write_text(str(scratch), encoding="utf-8")
          print(f"scratch root: {scratch}")
          PY

      - name: Verify the regenerated data carries telemetry
        run: |
          set -euo pipefail
          # A TCP handshake is evidence of reachability, not authenticated
          # proxy health. Use exactly the same contract as the release gate.
          scratch="$(cat scratch-root.txt)"
          test -s "$scratch/assets/js/data.js"
          python scripts/verify_dashboard_telemetry.py "$scratch/assets/js/data.js"

      - name: Run the one-time output parity gate
        run: |
          # The catalog and data.js this gate reads are the committed copies,
          # which the publish pipeline rewrites on the next release; staleness
          # between releases is an expected xfail, not a red suite.
          python -m pytest -q -p no:cacheprovider \
            tests/test_output_telemetry_coverage.py \
            tests/test_dashboard_telemetry_contract.py \
            tests/test_frontend_delivery.py \
            tests/test_formats_coverage.py \
            tests/test_verify_new_proxy_outputs.py

      - name: Report unresolved freshness markers
        if: always()
        run: |
          # A marker here means the committed snapshot predates a generator
          # improvement; the next publish reconciles it. Surfaced, never fatal.
          python -m pytest -q -p no:cacheprovider -rxX \
            tests/test_output_telemetry_coverage.py 2>&1 | grep -E "XFAIL|failed" || true

  # Required check. Its name is what branch protection matches, so it must not
  # change. `if: always()` is essential: a skipped or failed dependency would
  # otherwise skip this job, and GitHub treats a skipped required check as
  # passing.
  validate:
    name: quality-gate
    if: ${{ always() }}
    needs: [workflows, go, deploy-manifests, frontend, python, dependency-audit, dev-outputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "::error::at least one quality gate did not succeed"
            exit 1
          fi
