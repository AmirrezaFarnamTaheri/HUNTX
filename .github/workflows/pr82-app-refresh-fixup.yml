name: pr82-app-refresh-fixup

on:
  push:
    branches:
      - "codex/huntx-remediation-followup"
    paths:
      - ".github/workflows/pr82-app-refresh-fixup.yml"
  pull_request:
    paths:
      - ".github/workflows/pr82-app-refresh-fixup.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/huntx-remediation-followup
          fetch-depth: 1

      - name: Throttle visibility refreshes and rebuild bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/assets/js/app.js")
          text = path.read_text(encoding="utf-8")
          old = '''  startPublishedDataRefresh() {
            const refreshWhenVisible = () => {
              if (!document.hidden) this.refreshPublishedData();
            };
            this.boundVisibilityRefresh = refreshWhenVisible;
            document.addEventListener("visibilitychange", refreshWhenVisible);
            this.liveRefreshTimer = window.setInterval(refreshWhenVisible, 300000);
          }'''
          new = '''  startPublishedDataRefresh() {
            const MIN_REFRESH_INTERVAL_MS = 300000;
            let lastRefreshAt = Date.now();
            const refreshWhenVisible = () => {
              if (document.hidden) return;
              if (Date.now() - lastRefreshAt < MIN_REFRESH_INTERVAL_MS) return;
              lastRefreshAt = Date.now();
              this.refreshPublishedData();
            };
            this.boundVisibilityRefresh = refreshWhenVisible;
            document.addEventListener("visibilitychange", refreshWhenVisible);
            this.liveRefreshTimer = window.setInterval(refreshWhenVisible, MIN_REFRESH_INTERVAL_MS);
          }'''
          if old not in text:
              raise SystemExit("expected startPublishedDataRefresh implementation not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python3 - <<'PY'
          import scripts.update_frontend as frontend
          frontend.bundle()
          PY
          python3 scripts/update_frontend.py --check
          git diff --check

      - name: Commit fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/js/app.js docs/assets/js/bundle.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: throttle published data refresh"
          git push origin HEAD:codex/huntx-remediation-followup
