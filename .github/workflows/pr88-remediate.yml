name: pr88-one-shot-remediation

on:
  push:
    branches:
      - fix/mobile-touch-target-hardening
    paths:
      - scripts/pr88_remediation.py
      - .github/workflows/pr88-remediate.yml

concurrency:
  group: pr88-one-shot-remediation
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: fix/mobile-touch-target-hardening
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply and validate remediation waves
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr88-remediate.yml
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/pr88_remediation.py")
          text = path.read_text(encoding="utf-8")
          helper = '''    updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)\n'''
          if helper in text:
              text = text.replace(helper, '''    updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)\n''', 1)
          line = '''    app = replace_once(app, 'class="text-[10px] font-mono text-gray-500 truncate" title="${escapeHTML(link.display)}"', 'class="technical-ltr text-[10px] font-mono text-gray-500 truncate" title="${escapeHTML(link.display)}"', "artifact link bidi")\n'''
          if line in text:
              text = text.replace(line, '''    if 'class="text-[10px] font-mono text-gray-500 truncate" title="${escapeHTML(link.display)}"' in app:\n        app = replace_once(app, 'class="text-[10px] font-mono text-gray-500 truncate" title="${escapeHTML(link.display)}"', 'class="technical-ltr text-[10px] font-mono text-gray-500 truncate" title="${escapeHTML(link.display)}"', "artifact link bidi")\n''', 1)
          locale_line = '''        marker = f"  {locale}: {{\\n"\n'''
          if locale_line in text:
              text = text.replace(locale_line, '''        marker = f'  "{locale}": {{\\n' if "-" in locale else f"  {locale}: {{\\n"\n''', 1)
          ctor_test = '''  const app = new AppState();\n  assert.equal(app.getLatency({ latency: null, ping: null }), null);\n  assert.equal(app.getLatency({}), null);\n'''
          if ctor_test in text:
              text = text.replace(ctor_test, '''  const getLatency = AppState.prototype.getLatency;\n  assert.equal(getLatency.call({}, { latency: null, ping: null }), null);\n  assert.equal(getLatency.call({}, {}), null);\n''', 1)
          path.write_text(text, encoding="utf-8")
          PY

          set +e
          python scripts/pr88_remediation.py
          remediation_status=$?
          set -e

          if git log --format=%s "${GITHUB_SHA}..HEAD" | grep -Fxq "ci: cover frontend runtime, nested Go module, and dependency security"; then
            echo "All four remediation commits exist; pushing them before reporting final validation status."
            git push origin HEAD:fix/mobile-touch-target-hardening
          else
            echo "Refusing to push an incomplete remediation sequence."
            exit "${remediation_status:-1}"
          fi

          exit "$remediation_status"
