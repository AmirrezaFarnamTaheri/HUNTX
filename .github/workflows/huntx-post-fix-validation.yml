name: HUNTX Post-Fix Validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/huntx-post-fix-validation.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch huntx-production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/huntx.yml/dispatches" \
            -f ref=main
          echo "huntx-production dispatch accepted"
