name: PR 88 final cleanup

on:
  push:
    branches:
      - fix/mobile-touch-target-hardening
    paths:
      - .github/workflows/pr88-final-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mobile-touch-target-hardening
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply final cleanup
        run: python scripts/pr88_final_cleanup.py

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build:css
          git diff --exit-code -- docs/assets/css/tailwind.css
          node --experimental-default-type=module --test tests/frontend_runtime.test.mjs
          python -m compileall -q scripts/generate_site_data.py scripts/update_frontend.py tests/test_frontend_delivery.py
          python -m pytest -q tests/test_frontend_delivery.py
          python scripts/update_frontend.py --check
          git diff --check

      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "huntx-pr88-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/assets/js/app.js docs/assets/js/globe.js docs/assets/js/i18n.js scripts/generate_site_data.py scripts/update_frontend.py tests/frontend_runtime.test.mjs tests/test_frontend_delivery.py
          if git diff --cached --quiet; then
            echo "No final cleanup changes needed."
            exit 0
          fi
          git commit -m "fix(review): close remaining telemetry truthfulness gaps"
          git push origin HEAD:fix/mobile-touch-target-hardening
