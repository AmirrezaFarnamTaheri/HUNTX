name: PR 88 final cleanup

on:
  push:
    branches:
      - fix/mobile-touch-target-hardening
    paths:
      - .github/workflows/pr88-final-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mobile-touch-target-hardening
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Merge main and resolve expected generated-output conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "huntx-pr88-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unexpected=""
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                docs/assets/js/bundle.js)
                  # PR intentionally moved to native ES modules; keep bundle deletion.
                  git rm -f -- "$path"
                  ;;
                docs/index.html)
                  # Keep the PR's structural/UI work, then regenerate live counts below.
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                docs/assets/js/data.js|docs/catalog.json|docs/artifacts/*)
                  # These are newer generated telemetry outputs from main; keep them.
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  unexpected="${unexpected}${path}\n"
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)

            if [ -n "$unexpected" ]; then
              printf 'Unexpected conflicts; refusing to guess:\n%b' "$unexpected"
              exit 1
            fi
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            printf 'Unresolved conflicts remain:\n%s\n' "$remaining"
            exit 1
          fi

      - name: Apply final review cleanup
        run: python scripts/pr88_final_cleanup.py

      - name: Refresh generated frontend shell
        run: python scripts/update_frontend.py

      - name: Validate cleanup and merge resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          npm ci --ignore-scripts
          npm run build:css
          git diff --exit-code -- docs/assets/css/tailwind.css
          node --experimental-default-type=module --test tests/frontend_runtime.test.mjs
          python -m compileall -q scripts/generate_site_data.py scripts/update_frontend.py tests/test_frontend_delivery.py
          python -m pytest -q tests/test_frontend_delivery.py
          python scripts/update_frontend.py --check
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Commit and push resolved branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ]; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "merge: resolve PR 88 conflicts and close review gaps"
          git push origin HEAD:fix/mobile-touch-target-hardening
