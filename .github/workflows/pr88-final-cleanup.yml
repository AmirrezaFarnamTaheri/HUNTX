name: PR 88 final cleanup

on:
  push:
    branches:
      - fix/mobile-touch-target-hardening
    paths:
      - .github/workflows/pr88-final-cleanup.yml

concurrency:
  group: pr88-final-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mobile-touch-target-hardening
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Regenerate frontend shell from resolved artifacts
        run: python scripts/update_frontend.py

      - name: Validate final frontend state
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          npm ci --ignore-scripts
          npm run build:css
          git diff --exit-code -- docs/assets/css/tailwind.css
          node --experimental-default-type=module --test tests/frontend_runtime.test.mjs
          python -m compileall -q scripts/generate_site_data.py scripts/update_frontend.py tests/test_frontend_delivery.py
          python -m pytest -q tests/test_frontend_delivery.py
          python scripts/update_frontend.py --check
          git diff --check

      - name: Remove temporary remediation machinery and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "huntx-pr88-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr88-final-cleanup.yml scripts/pr88_final_cleanup.py
          git add -A
          git commit -m "chore: finalize PR 88 conflict and review cleanup"
          git push origin HEAD:fix/mobile-touch-target-hardening
