name: Publish Historical Subscriptions

# Publish ONLY history already sealed on generated-outputs, never a new live release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-historical-subscriptions.yml"
      - "scripts/publish_historical_subscriptions.py"

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize against the production publisher to avoid overwriting new releases.
concurrency:
  group: publish-generated-outputs
  cancel-in-progress: false

jobs:
  historical-only:
    name: Deploy already-published historical protocol subscriptions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout immutable main control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install verified Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --prefer-binary -r requirements.txt
          python -m pip check

      - name: Restore last SHA256-sealed publication
        id: previous
        env:
          PREVIOUS_ROOT: ${{ runner.temp }}/huntx-history-prior
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin refs/heads/generated-outputs | awk '{print $1}')"
          if [[ ! "$remote_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=No sealed history::Missing generated-outputs branch"
            exit 1
          fi
          echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin refs/heads/generated-outputs:refs/remotes/origin/generated-outputs
          git worktree add --detach "$PREVIOUS_ROOT" refs/remotes/origin/generated-outputs
          test -s "$PREVIOUS_ROOT/manifests/SHA256SUMS"
          test -s "$PREVIOUS_ROOT/manifests/publication.json"
          test -s "$PREVIOUS_ROOT/outputs_dev/_manifest.json.gz.index.json"

      - name: Assemble and validate historical-only Pages snapshot
        env:
          PYTHONPATH: src
          PREVIOUS_ROOT: ${{ runner.temp }}/huntx-history-prior
          TARGET: ${{ runner.temp }}/huntx-history-staged
        run: |
          set -euo pipefail
          python -m scripts.publish_historical_subscriptions \
            --previous-root "$PREVIOUS_ROOT" --main-docs-root docs \
            --destination "$TARGET" --control-commit "$GITHUB_SHA"
          python scripts/validate_pages_package.py "$TARGET/docs"
          python - "$TARGET/docs" <<'PY'
          from pathlib import Path
          from sys import argv
          from scripts.verify_deployed_pages import expected_public_paths
          paths = expected_public_paths(Path(argv[1]))
          for required in (
              "subscriptions.html",
              "subscriptions/latest/index.json",
              "subscriptions/latest/all.txt",
              "subscriptions/latest/all_base64.txt",
              "subscriptions/latest/slipnet.txt",
              "subscriptions/latest/trojan.txt",
          ):
              assert required in paths, f"Missing sealed historical public path: {required}"
          print(f"Sealed historical Pages snapshot: {len(paths)} verified paths")
          PY

      - name: Revalidate main before deployment
        run: |
          set -euo pipefail
          current="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          test "$current" = "$GITHUB_SHA" || {
            echo "::error title=Stale history control::Main changed during assembly"
            exit 1
          }

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload sealed history and preserved release to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/huntx-history-staged/docs

      - name: Deploy historical subscriptions to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify public Pages integrity and feed checksums
        id: live
        timeout-minutes: 12
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          SNAPSHOT_DOCS: ${{ runner.temp }}/huntx-history-staged/docs
        run: |
          set -euo pipefail
          python scripts/verify_deployed_pages.py \
            --snapshot-root "$SNAPSHOT_DOCS" --page-url "$PAGES_URL" \
            --attempts 12 --interval 10 --request-timeout 20 --max-seconds 600

      - name: Advance generated-outputs only after public verification
        if: steps.deployment.outcome == 'success' && steps.live.outcome == 'success'
        env:
          SNAPSHOT_ROOT: ${{ runner.temp }}/huntx-history-staged
          GIT_SNAPSHOT: ${{ runner.temp }}/huntx-history-git-snapshot
          RESTORED_SHA: ${{ steps.previous.outputs.sha }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - "$SNAPSHOT_ROOT" "$GIT_SNAPSHOT" <<'PY'
          from pathlib import Path
          from sys import argv
          from scripts.assemble_generated_snapshot import prepare_repository_snapshot
          prepare_repository_snapshot(Path(argv[1]), Path(argv[2]))
          PY
          current_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          current_generated="$(git ls-remote --heads origin refs/heads/generated-outputs | awk '{print $1}')"
          if [[ "$current_main" != "$GITHUB_SHA" || "$current_generated" != "$RESTORED_SHA" ]]; then
            echo "::error title=Concurrent publication::Main or generated history changed; refusing ledger rollback"
            exit 1
          fi
          git checkout -- .
          git clean -fdq
          git fetch --no-tags origin "$RESTORED_SHA"
          git checkout -B generated-outputs-history "$RESTORED_SHA"
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a "$GIT_SNAPSHOT"/. .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --check -- . \
            ':(exclude)docs/history/MASTER_FORENSIC_COMPENDIUM.md' \
            ':(exclude)docs/manifest.json'
          if git diff --cached --quiet; then
            echo "Historical snapshot is already published."
            exit 0
          fi
          git commit -m "Publish sealed historical latest-100 subscriptions"
          git push origin HEAD:refs/heads/generated-outputs \
            --force-with-lease="refs/heads/generated-outputs:$RESTORED_SHA"

      - name: Summarize historical deployment
        if: always()
        env:
          OLD_SHA: ${{ steps.previous.outputs.sha }}
          LIVE_RESULT: ${{ steps.live.outcome }}
        run: |
          {
            echo "## Historical-only subscription deployment"
            echo
            echo "- Old verified release and telemetry are unchanged"
            echo "- Cumulative source: $OLD_SHA"
            echo "- Historical health status: unverified (never a live release)"
            echo "- Public Pages integrity: $LIVE_RESULT"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
