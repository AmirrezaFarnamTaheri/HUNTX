name: HUNTX Schedule Watchdog

on:
  schedule:
    - cron: "47 * * * *"
  # GitHub's cron service can lag or skip runs. A verified main update to
  # production code rechecks the same guarded recovery policy immediately.
  # Path filtering avoids an expensive retry on documentation-only merges.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/huntx-schedule-watchdog.yml"
      - ".github/workflows/huntx.yml"
      - "src/huntx/**"
      - "scripts/generate_site_data.py"
      - "scripts/verify_dashboard_telemetry.py"
      - "scripts/assemble_generated_snapshot.py"
      - "scripts/validate_pages_package.py"
      - "docs/assets/js/**"
      - ".github/workflows/publish-generated-outputs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: huntx-schedule-watchdog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  recover-stale-production:
    name: recover-stale-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover missing production schedule
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          production_runs="$(gh api "repos/${GH_REPO}/actions/workflows/huntx.yml/runs?per_page=20")"
          production_active="$(jq '[.workflow_runs[] | select(.head_branch == "main") | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length' <<<"$production_runs")"
          if (( production_active > 0 )); then
            echo "huntx-production already has an active run; recovery is unnecessary."
            exit 0
          fi

          recovery_runs="$(gh api "repos/${GH_REPO}/actions/workflows/huntx-recovery-orchestrator.yml/runs?per_page=20")"
          recovery_active="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length' <<<"$recovery_runs")"
          if (( recovery_active > 0 )); then
            echo "HUNTX Recovery Orchestrator is already active; duplicate recovery is unnecessary."
            exit 0
          fi

          latest="$(jq -c '[.workflow_runs[] | select(.head_branch == "main") | select(.event == "schedule" or .event == "workflow_dispatch")] | sort_by(.created_at) | last // empty' <<<"$production_runs")"
          dispatch_recovery() {
            echo "Dispatching verified HUNTX recovery orchestrator."
            gh api --method POST \
              "repos/${GH_REPO}/actions/workflows/huntx-recovery-orchestrator.yml/dispatches" \
              -f ref=main
          }

          if [[ -z "$latest" ]]; then
            echo "::warning title=Production history missing::No production schedule/dispatch run was found; starting verified recovery."
            dispatch_recovery
            exit 0
          fi

          created_at="$(jq -r '.created_at' <<<"$latest")"
          event="$(jq -r '.event' <<<"$latest")"
          status="$(jq -r '.status' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
          latest_id="$(jq -r '.id' <<<"$latest")"
          latest_sha="$(jq -r '.head_sha // ""' <<<"$latest")"
          latest_epoch="$(date -u -d "$created_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds="$(( now_epoch - latest_epoch ))"

          echo "latest_run_id=$latest_id"
          echo "latest_event=$event"
          echo "latest_status=$status"
          echo "latest_conclusion=$conclusion"
          echo "latest_age_seconds=$age_seconds"
          echo "latest_source_sha=$latest_sha"
          echo "watchdog_main_sha=$GITHUB_SHA"

          # A completed producer from an older source revision cannot authorize
          # publishing the current source code. Treat this as stale immediately
          # after a relevant main push, even if the producer is under 2h20m old.
          # The active-producer and active-recovery checks above always take
          # precedence, preventing duplicate dispatch during an ongoing run.
          if [[ -z "$latest_sha" ]]; then
            echo "::error title=Missing producer source SHA::Cannot verify production source revision."
            exit 1
          fi
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "::warning title=Production source revision stale::Latest run $latest_id used an earlier source commit; dispatching verified recovery for current main."
            dispatch_recovery
            exit 0
          fi

          if [[ "$event" == "schedule" && "$status" == "completed" && "$conclusion" != "success" && "$age_seconds" -ge 900 ]]; then
            echo "::warning title=Scheduled production failed::Run $latest_id concluded $conclusion; starting one verified recovery."
            dispatch_recovery
            exit 0
          fi

          # Production is expected every two hours. Allow scheduler jitter but
          # recover once the latest production run is more than 2h20m old.
          if (( age_seconds >= 8400 )); then
            echo "::warning title=Production schedule stale::Latest production run $latest_id is ${age_seconds}s old; starting verified recovery."
            dispatch_recovery
            exit 0
          fi

          echo "Production cadence is healthy; no recovery dispatch needed."
