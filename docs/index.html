    /*
      Focus indication (WCAG 2.4.7).

      :focus-visible carries the refined behaviour — a keyboard user gets the
      indicator, a mouse user does not. It is not sufficient on its own: the
      heuristic that decides whether a focus is "visible" varies between
      engines and does not resolve at all when focus is moved
      programmatically, which is how dynamically rendered controls such as the
      artifact copy buttons end up focused with no indicator.

      So :focus provides the guarantee and :focus-visible provides the polish.
      Every focused control is always indicated; a control focused by pointer
      gets a dimmer indicator rather than none.
    */
    /*
      Baseline for every native control, at zero specificity (:where) so any
      component rule overrides it. Without this, a control is only
      keyboard-operable if whoever wrote it remembered to add .focus-ring —
      the primary "Browse Proxies" call to action had not.
    */
    :where(button, [role="button"], a[href], summary, [tabindex]:not([tabindex="-1"])):focus {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    .focus-ring:focus {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
      /*
        Many focusable controls carry `transition: all` (Tailwind's
        transition-all, and .nav-tab-btn), which would animate the outline
        width from 0 to 2px. A focus indicator must be present the instant
        focus lands — for screen magnifier users and for anyone tabbing
        quickly — so outline properties are excluded from the transition.
        Higher specificity than the utility class, so it wins on focus-in.
      */
      transition-property: color, background-color, border-color, box-shadow, opacity, transform;
    }

    .focus-ring:focus:not(:focus-visible) {
      outline-color: color-mix(in srgb, var(--accent-cyan) 55%, transparent);
    }

    .focus-ring:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    }

    html.light .bg-gray-800\/80 {

      border-color: #cbd5e1 !important;
      color: #1e293b !important;

    html.light .hover\:bg-gray-700:hover {

      color: #0f172a !important;
    }

    html.light .bg-gradient-to-r.from-cyan-500.to-blue-600 {
      background: linear-gradient(135deg, #0369a1, #1d4ed8) !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }
    html.light .bg-gradient-to-r.from-cyan-500.to-blue-600 svg,
    html.light .bg-gradient-to-r.from-cyan-500.to-blue-600 span {
      color: #ffffff !important;
    }

    /* Dark theme: the blue-600 end of the same gradient reads 4.02:1 against
       these near-black 12px bold labels. Setting the stops directly to
       cyan-500 -> blue-500 puts the whole surface at 5.63:1. Scoped to the two
       buttons that are not covered by the quiet .hero-actions treatment. */
    html.dark #btn-explore-live-proxies,
    html.dark #btn-copy-artifact-qr-url {
      background: linear-gradient(135deg, #06b6d4, #3b82f6) !important;
      color: #020617 !important;
    }
    html.dark #btn-explore-live-proxies:hover,
    html.dark #btn-copy-artifact-qr-url:hover {
      background: linear-gradient(135deg, #22d3ee, #3b82f6) !important;
    }

    /* Table styling in Light Mode */
    html.light thead {
      background-color: #f8fafc !important;
      color: #475569 !important;
      border-color: #e2e8f0 !important;
    }
    html.light tbody tr:hover {
      background-color: #f1f5f9 !important;
    }
    html.light tbody tr {
      border-color: #e2e8f0 !important;
    }

    /* Modals & Overlays */
    html.light #modal-overlay > div {
      background-color: rgba(15, 23, 42, 0.45) !important;
    }
    html.light #modal-box {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.2) !important;
    }

    /* Toast Notifications */
    html.light .toast-pill {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.15) !important;
    }

    /* Globe Radar Canvas container in light mode */
    html.light #telemetry-globe-canvas {
      background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f1f5f9 100%);
    }

    /* Operate mode: compact summary, quiet panels, readable snapshot metadata. */
    .radar-overview { display: grid; gap: 1.5rem; padding: 0.5rem 0 1.5rem; border-bottom: 1px solid var(--border-subtle); }
    .radar-summary { min-width: 0; }
    .radar-summary h1 { font-size: clamp(1.5rem, 2.3vw, 2rem); line-height: 1.25; font-weight: 650; letter-spacing: -0.025em; }
    .radar-summary h1 span { color: var(--text-muted); }
    .radar-description { color: var(--text-muted); font-size: 0.875rem; max-width: 65ch; margin-top: 0.75rem; }
    .radar-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin: 1.5rem 0 1rem; }
    .radar-metrics dt { color: var(--text-muted); font-size: 0.75rem; }
    .radar-metrics dd { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 0.25rem; }
    .radar-metrics span { color: var(--text-muted); font-size: 0.75rem; display: block; }
    .radar-globe-frame { max-width: 240px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface); }
    .radar-globe-frame .animate-ping { animation: none; }
    html .bg-cyber-mesh { background-image: none; }
    html .hero-actions > :is(a, button) { background: var(--bg-surface) !important; border: 1px solid var(--border-subtle) !important; color: var(--text-main) !important; box-shadow: none !important; border-radius: var(--radius-sm); }
    html .hero-actions > :is(a, button):hover { border-color: var(--accent-cyan) !important; }
    html .hero-actions > :is(a, button) svg { color: currentColor !important; }
    /* Light theme only: these are 12px bold labels (not large text), and
       white on the gradient's light end #0284c7 measures 4.10:1, under the
       4.5:1 floor. A deeper solid cyan clears it at 5.93:1. The dark hero
       keeps its cyan->blue gradient with near-black text, which measures
       4.0:1 at the blue end and 8.5:1 at the cyan end. */
    html.light #hero-copy-sub, html.light #btn-explore-live-proxies { background: #0369a1 !important; color: #ffffff !important; box-shadow: none !important; border-radius: var(--radius-sm); }
    html #hero-copy-sub svg { color: currentColor !important; }
    html #radar-diagnostics > .grid { margin-top: 0; }
    html #radar-diagnostics .cyber-card { background: var(--bg-surface) !important; border-color: var(--border-subtle) !important; border-radius: var(--radius-md); box-shadow: none !important; backdrop-filter: none; }
    #radar-diagnostics h3 { flex-wrap: wrap; font-family: inherit; font-size: 1rem; }
    #radar-diagnostics .operator-card { border-radius: var(--radius-sm); background: transparent !important; border-color: transparent !important; padding: 0.5rem 0; }
    #radar-diagnostics .operator-card:hover { background: var(--bg-elevated) !important; }
    #radar-diagnostics .operator-card > div { flex-wrap: wrap; gap: 0.25rem; }
    #radar-diagnostics .operator-card .truncate { max-width: 100%; }
    #radar-diagnostics .operator-card > div:last-child { border: 0; }
    #radar-diagnostics .geo-density-row .bg-gradient-to-r { background: var(--accent-cyan); }
    html .proxy-card { min-width: 0; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
    html .proxy-card:hover { border-color: var(--border-active); }
    .proxy-card-header { flex-wrap: wrap; gap: 0.5rem; }
    html .proxy-card .proxy-secondary-tag { background: transparent !important; color: var(--text-muted) !important; box-shadow: none !important; }
    .proxy-card-header .shadow-sm { box-shadow: none; }
    .proxy-specs > div { gap: 0.5rem; flex-wrap: wrap; }
    .proxy-specs > div > :last-child { min-width: 0; overflow-wrap: anywhere; }
    .proxy-specs .technical-ltr { max-width: 100%; }
    .proxy-specs > div > .flex { flex-wrap: wrap; }
    html.dark .text-gray-500,
    html.dark .text-gray-600 { color: var(--text-muted); }
    /* Broadened beyond main: the header, footer and kbd hints carry the
       same classes and also need the deeper cyan. */
    html.light input::placeholder, html.light textarea::placeholder { color: var(--text-dimmed) !important; }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 200; padding: 12px 16px; background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--accent-cyan); border-radius: var(--radius-sm); transform: translateY(-200%); }
    .skip-link:focus { transform: translateY(0); outline: 2px solid var(--accent-cyan); outline-offset: 2px; }
    #dashboard-main { scroll-margin-top: 140px; }
    #dashboard-main:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: -2px; }
    html #data-status-pill { max-width: calc(100vw - 24px); border-radius: var(--radius-sm); }
    @media (min-width: 640px) { .radar-metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (min-width: 1024px) {
      .radar-overview { grid-template-columns: minmax(0, 1fr) 280px; align-items: center; }
      .radar-globe-frame { max-width: 280px; }
    }

    /* WCAG 2.2 contrast hardening (audit 2026-09-18, harness in
       tests/lib/wcag_audit.mjs). Per the W3C understanding of 1.4.11 a control that
       shows a text label or a >=3:1 icon is already identifiable and needs no
       boundary, so these rules cover only surfaces and form fields. Every
       ratio was measured against the rendered surface, not the palette. */

    /* Dark theme: placeholder and muted gray text must clear 4.5:1
       (text-gray-500/600 read 4.17:1 and 2.67:1 on the darkest surfaces). */
    html.dark input::placeholder,
    html.dark textarea::placeholder { color: #94a3b8 !important; }

    /* Light theme: cyan-200 has no override elsewhere. */
    html.light .text-cyan-200 { color: #0369a1 !important; }

    /* Light theme: the slate family has no light overrides and was rendering
       dark-on-dark (1.4:1 on badges, dark surfaces behind footer links). */
    html.light .bg-slate-800,
    html.light .bg-slate-900,
    html.light .bg-slate-900\/60 { background-color: #ffffff !important; border-color: #e2e8f0 !important; color: #0f172a !important; }
    html.light .text-slate-300,
    html.light .text-slate-400 { color: #334155 !important; }
    html.light .border-slate-700,
    html.light .border-slate-700\/50 { border-color: #cbd5e1 !important; }

    /* Light theme: arbitrary near-black surfaces have no override and stay
       dark, so muted text on them fell to 3.35:1. */
    html.light .bg-\[\#070a0f\]\/90,
    html.light .bg-\[\#070a0f\]\/80 { background-color: #f8fafc !important; border-color: #e2e8f0 !important; }

    /* Light theme: translucent 500/20 badge fills are not covered by the 950
       overrides; give them the same tinted surfaces the 950 badges use. */
    html.light .bg-cyan-500\/20 { background-color: #e0f2fe !important; }
    html.light .bg-emerald-500\/20 { background-color: #dcfce7 !important; }
    html.light .bg-indigo-500\/20 { background-color: #e0e7ff !important; }
  </style>

            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
          <span>Protocol Inspector</span>
          <span class="px-1.5 py-0.5 text-xs font-bold rounded bg-purple-950/80 text-purple-300 border border-purple-800/60">RAW</span>
        </button>

        <!-- Tab 5: Artifacts Repository -->
        <button
          class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-mono font-semibold flex items-center gap-2 border transition-all focus-ring cursor-pointer"
          data-tab-target="artifacts"
          role="tab"
          aria-selected="false"
          aria-controls="tab-panel-artifacts"
          id="tab-btn-artifacts"
        >
          <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
          <span>Artifacts &amp; Feeds</span>
          <span id="tab-artifacts-count-badge" class="px-1.5 py-0.5 text-xs font-bold rounded bg-amber-950/80 text-amber-300 border border-amber-800/60">5</span>
        </button>
      </div>

      <div class="hidden lg:flex items-center gap-2 text-xs font-mono" style="color: var(--text-muted)">
        <span>Tabs: <kbd class="px-1.5 py-0.5 bg-gray-900 border border-gray-800 rounded text-cyan-400 font-bold">1</kbd>–<kbd class="px-1.5 py-0.5 bg-gray-900 border border-gray-800 rounded text-cyan-400 font-bold">5</kbd></span>
      </div>
    </div>
  </nav>

  <!-- Main Telemetry Tabbed Workspace -->
  <main id="dashboard-main" tabindex="-1" class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-16">
    <!-- TAB 1 PANEL: Telemetry Radar & 3D Globe -->
    <div id="tab-panel-radar" class="tab-panel animate-fade-in space-y-8" role="tabpanel" aria-labelledby="tab-btn-radar" style="display: block;">
      <section id="hero-section"></section>
      <section id="radar-diagnostics" class="space-y-6"></section>
    </div>

    <!-- TAB 2 PANEL: Published Proxies Stream Grid -->
    <div id="tab-panel-proxies" class="tab-panel hidden space-y-6" role="tabpanel" aria-labelledby="tab-btn-proxies" hidden style="display: none !important;">
      <section id="filter-bar" class="relative mb-6"></section>
      <section class="mt-4">
        <div id="nodes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Populated by JavaScript bundle -->
        </div>
      </section>
    </div>

    <!-- TAB 3 PANEL: Protocol & Routing Studio -->
    <div id="tab-panel-studio" class="tab-panel hidden space-y-8" role="tabpanel" aria-labelledby="tab-btn-studio" hidden style="display: none !important;">
      <section id="rule-studio-section"></section>
    </div>

    <!-- TAB 4 PANEL: Deep Protocol Inspector & In-Browser Decoder -->
    <div id="tab-panel-decoder" class="tab-panel hidden space-y-8" role="tabpanel" aria-labelledby="tab-btn-decoder" hidden style="display: none !important;">
      <section id="decoder-section"></section>
      <section id="inline-decoder-section"></section>
    </div>

    <!-- TAB 5 PANEL: Pipeline Artifacts & Subscriptions Registry -->
    <div id="tab-panel-artifacts" class="tab-panel hidden space-y-8" role="tabpanel" aria-labelledby="tab-btn-artifacts" hidden style="display: none !important;">
      <section id="artifacts-section"></section>
      <section id="artifact-section"></section>
    </div>
  </main>

  <!-- Cyber Footer -->
  <footer id="main-footer" class="bg-[#070a0f]/90 border-t border-[#1d2638]"></footer>

  <!-- Modal Dialog Container -->
  <div id="modal-overlay" class="hidden"></div>

  <!-- Floating Toast Notification System -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true" class="fixed bottom-6 inset-x-4 sm:inset-x-auto sm:right-6 z-[9999] flex flex-col items-center sm:items-end gap-2 pointer-events-none max-w-md mx-auto sm:mx-0"></div>

  <!-- Native ES-module entrypoint; fallback data is lazy-loaded on demand. -->
  <!-- Recovers a visit whose cached modules predate the deployed entry script. Must precede the module. -->
  <script src="assets/js/boot-guard.js"></script>
  <script type="module" src="assets/js/app.js"></script>

  <!-- Progressive Web App (PWA) Offline ServiceWorker Registration -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[HUNTX-PWA] ServiceWorker active, scope:', reg.scope))
          .catch(err => console.warn('[HUNTX-PWA] ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
