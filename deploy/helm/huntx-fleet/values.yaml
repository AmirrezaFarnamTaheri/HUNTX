replicaCount: 3

image:
  repository: ghcr.io/amirrezaw/huntx-probe
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 9091

probes:
  - id: probe-us-east
    region: US
  - id: probe-eu-central
    region: DE
  - id: probe-me-south
    region: IR

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi
