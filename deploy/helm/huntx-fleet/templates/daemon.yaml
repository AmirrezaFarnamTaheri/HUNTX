apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "huntx-fleet.fullname" . }}-daemon
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "huntx-fleet.name" . }}, app.kubernetes.io/component: daemon }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "huntx-fleet.name" . }}, app.kubernetes.io/component: daemon }
    spec:
      containers:
        - name: daemon
          image: "{{ .Values.daemon.image.repository }}:{{ .Values.daemon.image.tag }}"
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.daemon.service.port }} }]
          startupProbe:
            httpGet: { path: /status, port: http }
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
{{ toYaml .Values.resources | indent 12 }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.daemon.service.port }}"
            - name: HUNTX_DAEMON_CONTROL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "huntx-fleet.fullname" . }}-control, key: token } }
            - name: HUNTX_DAEMON_NODES_JSON
              value: {{ required "daemon.nodesJson is required" .Values.daemon.nodesJson | quote }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "huntx-fleet.fullname" . }}-daemon }
spec:
  selector: { app.kubernetes.io/name: {{ include "huntx-fleet.name" . }}, app.kubernetes.io/component: daemon }
  ports: [{ name: http, port: {{ .Values.daemon.service.port }}, targetPort: http }]
