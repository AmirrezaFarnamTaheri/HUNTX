apiVersion: v1
kind: Secret
metadata: { name: {{ include "huntx-fleet.fullname" . }}-control }
type: Opaque
stringData:
  token: {{ required "daemon.controlToken is required" .Values.daemon.controlToken | quote }}
  orchestrator-token: {{ required "orchestratorBearerToken is required" .Values.orchestratorBearerToken | quote }}
