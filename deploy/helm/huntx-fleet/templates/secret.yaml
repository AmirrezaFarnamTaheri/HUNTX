apiVersion: v1
kind: Secret
metadata: { name: {{ include "huntx-fleet.fullname" . }}-control }
type: Opaque
stringData:
  token: {{ required "daemon.controlToken is required" .Values.daemon.controlToken | quote }}
{{- if .Values.orchestratorBearerToken }}
  orchestrator-token: {{ .Values.orchestratorBearerToken | quote }}
{{- end }}
